<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cardio + Sono Planner</title>
<style>
:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2a2a2a;--text:#f0f0f0;--muted:#777;--green:#4ade80;--green-dim:#152b1e;--blue:#60a5fa;--blue-dim:#152038;--amber:#fbbf24;--amber-dim:#2e2008;--teal:#2dd4bf;--teal-dim:#0b2826;--purple:#a78bfa;--purple-dim:#1e1635;--orange:#fb923c;--orange-dim:#2e1a08;--red:#f87171;--red-dim:#2e1212;--r:14px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.app{max-width:500px;margin:0 auto;padding-bottom:130px}
.header{padding:20px 16px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.header h1{font-size:21px;font-weight:700;letter-spacing:-.5px}
.header p{font-size:13px;color:var(--muted);margin-top:3px}
.sticky-controls{position:sticky;top:65px;background:var(--bg);z-index:9;padding:10px 16px 0;border-bottom:1px solid var(--border);padding-bottom:10px}
.search-input{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:15px;outline:none;margin-bottom:10px}
.search-input::placeholder{color:var(--muted)}
.cats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cat-btn{padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.cat-btn.active{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.section-label{padding:14px 16px 8px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.food-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.food-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px;cursor:pointer;transition:all .15s;display:flex;gap:11px;align-items:flex-start}
.food-item:active{transform:scale(.98)}
.food-item.selected{background:var(--green-dim);border-color:var(--green)}
.food-item.selected.negative{background:var(--red-dim);border-color:var(--red)}
.food-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.food-item.selected .food-check{background:var(--green);border-color:var(--green)}
.food-item.selected.negative .food-check{background:var(--red);border-color:var(--red)}
.check-icon{display:none}
.food-item.selected .check-icon{display:block}
.food-body{flex:1;min-width:0}
.food-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px}
.food-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.3}
.food-pts{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);flex-shrink:0}
.food-pts.pos{background:var(--green-dim);color:var(--green)}
.food-pts.neg{background:var(--red-dim);color:var(--red)}
.food-cat{font-size:11px;color:var(--muted);margin-bottom:5px}
.food-desc{font-size:13px;color:#aaa;line-height:1.5;margin-bottom:8px}
.prep-label{font-size:11px;color:var(--muted);margin-bottom:6px;margin-top:2px}
.prep-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.prep-btn{padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s}
.prep-btn.active{background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}
.food-bars{display:flex;flex-direction:column;gap:5px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-size:11px;width:72px;flex-shrink:0}
.bar-bg{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;position:relative}
.bar-fill{height:4px;border-radius:2px;transition:width .3s}
.bar-val{font-size:11px;font-weight:600;width:24px;text-align:right;flex-shrink:0}
.b-cardio{background:var(--blue)}.t-cardio{color:var(--blue)}
.b-energia{background:var(--amber)}.t-energia{color:var(--amber)}
.b-anti{background:var(--teal)}.t-anti{color:var(--teal)}
.b-sono{background:var(--purple)}.t-sono{color:var(--purple)}
.b-inflam{background:var(--orange)}.t-inflam{color:var(--orange)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px 28px;z-index:20}
.bottom-inner{max-width:500px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.count-info{font-size:13px;color:var(--muted)}
.count-info span{color:var(--text);font-weight:600}
.ver-btn{padding:13px 22px;background:var(--green);color:#000;font-size:14px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer;flex-shrink:0}
.ver-btn:disabled{background:var(--surface2);color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
.overlay.open{display:block}
.ov-wrap{max-width:500px;margin:0 auto;padding:20px 16px 60px}
.ov-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ov-header h2{font-size:18px;font-weight:700}
.score-hero{background:var(--surface);border-radius:var(--r);padding:22px;margin-bottom:14px;text-align:center}
.score-pct{font-size:68px;font-weight:800;letter-spacing:-3px;line-height:1}
.score-nota{font-size:17px;font-weight:600;margin-top:4px;margin-bottom:14px}
.score-bar-bg{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:14px}
.score-bar-fill{height:8px;border-radius:4px}
.score-insight{font-size:13px;color:#bbb;line-height:1.6;text-align:left}
.warn-banner{background:var(--red-dim);border:1px solid var(--red);border-radius:var(--r);padding:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.warn-icon{font-size:18px;flex-shrink:0}
.warn-text{font-size:13px;color:#f8b4b4;line-height:1.5}
.warn-text strong{color:#fff}
.pillars-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pillar-card{background:var(--surface);border-radius:var(--rs);padding:14px}
.pillar-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.pillar-val{font-size:22px;font-weight:700;margin-bottom:6px}
.pillar-bar-bg{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.pillar-bar-fill{height:4px;border-radius:2px}
.analysis-section{margin-bottom:14px}
.analysis-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
.analysis-card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:8px}
.analysis-card.neg{border:1px solid var(--red-dim)}
.analysis-food-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.analysis-food-cat{font-size:11px;color:var(--muted);margin-bottom:8px}
.analysis-desc{font-size:13px;color:#aaa;line-height:1.5;margin-bottom:6px}
.analysis-tip{font-size:12px;line-height:1.5;border-left:2px solid var(--purple);padding-left:8px;margin-top:6px;color:var(--purple)}
.analysis-tip.neg{border-left-color:var(--red);color:#f8b4b4}
.combos-card,.gaps-card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:8px}
.combo-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:#bbb;line-height:1.5}
.combo-item:last-child{border-bottom:none;padding-bottom:0}
.combo-item strong{color:var(--text)}
.gap-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;color:#bbb}
.gap-item:last-child{border-bottom:none}
.gap-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.chips-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 10px;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:12px}
.chip.neg{border-color:var(--red-dim);background:var(--red-dim)}
.chip-x{color:var(--muted);font-size:15px;cursor:pointer;line-height:1}
.limpar-btn{width:100%;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-size:14px;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Cardio + Sono Planner</h1>
    <p>monte seu dia real — comida boa, ruim e tudo no meio</p>
  </div>
  <div class="sticky-controls">
    <input class="search-input" type="search" id="search" placeholder="buscar alimento..." autocomplete="off">
    <div class="cats" id="cats"></div>
  </div>
  <div class="section-label" id="listLabel">todos os alimentos</div>
  <div class="food-list" id="foodList"></div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <div class="count-info">selecionados: <span id="countNum">0</span></div>
    <button class="ver-btn" id="verBtn" disabled onclick="openResult()">ver análise</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="ov-wrap">
    <div class="ov-header">
      <button class="back-btn" onclick="closeResult()">&#8592;</button>
      <h2>análise do seu dia</h2>
    </div>
    <div id="resultContent"></div>
  </div>
</div>

<script>

const cats = ['todos', ...[...new Set(foods.map(f => f.cat))]];
let activeFilter = 'todos';
let selected = new Map(); // id -> prepIndex (ou 0)

function renderCats() {
  document.getElementById('cats').innerHTML = cats.map(c =>
    `<button class="cat-btn${c === activeFilter ? ' active' : ''}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');
}
function setFilter(c) { activeFilter = c; renderCats(); renderFoods(); }

function effective(f, prepIdx) {
  const base = {pts:f.pts,cardio:f.cardio,energia:f.energia,anti:f.anti,sono:f.sono,inflam:f.inflam};
  if (f.preps && f.preps[prepIdx]) {
    const d = f.preps[prepIdx].d || {};
    for (const k in d) base[k] = Math.max(-10, Math.min(10, base[k] + d[k]));
  }
  return base;
}
function clamp10(v){return Math.max(0,Math.min(10,v));}

function renderFoods() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const list = foods.filter(f => {
    const mc = activeFilter === 'todos' || f.cat === activeFilter;
    const mq = !q || f.name.includes(q) || f.cat.includes(q) || f.desc.toLowerCase().includes(q);
    return mc && mq;
  });
  document.getElementById('listLabel').textContent = q ? `resultado para "${q}"` : activeFilter === 'todos' ? 'todos os alimentos' : activeFilter;
  const el = document.getElementById('foodList');
  if (!list.length) { el.innerHTML = '<div class="empty">nenhum alimento encontrado</div>'; return; }
  el.innerHTML = list.map(f => {
    const sel = selected.has(f.id);
    const prepIdx = sel ? selected.get(f.id) : 0;
    const e = effective(f, prepIdx);
    const ptsClass = e.pts > 0 ? 'pos' : e.pts < 0 ? 'neg' : '';
    const ptsTxt = e.pts > 0 ? '+'+e.pts : e.pts;
    let prepHtml = '';
    if (f.preps) {
      prepHtml = `<div class="prep-label">preparo:</div><div class="prep-opts">` +
        f.preps.map((p,i)=>`<button class="prep-btn${sel && prepIdx===i ? ' active':''}" onclick="event.stopPropagation();setPrep('${f.id}',${i})">${p.n}</button>`).join('') +
        `</div>`;
    }
    return `<div class="food-item${sel ? ' selected':''}${sel && e.pts<0 ? ' negative':''}" onclick="toggle('${f.id}')">
      <div class="food-check"><svg class="check-icon" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="food-body">
        <div class="food-top"><div class="food-name">${f.name}</div><div class="food-pts ${ptsClass}">${ptsTxt}</div></div>
        <div class="food-cat">${f.cat}</div>
        <div class="food-desc">${f.desc}</div>
        ${prepHtml}
        <div class="food-bars">
          ${barRow('cardio','cardio',clamp10(e.cardio))}
          ${barRow('energia','energia',clamp10(e.energia))}
          ${barRow('anti','antioxid.',clamp10(e.anti))}
          ${barRow('inflam','anti-inflam',clamp10(e.inflam))}
          ${barRow('sono','sono',clamp10(e.sono))}
        </div>
      </div>
    </div>`;
  }).join('');
}
function barRow(key,label,val){
  return `<div class="bar-row"><span class="bar-label t-${key}">${label}</span><div class="bar-bg"><div class="bar-fill b-${key}" style="width:${val*10}%"></div></div><span class="bar-val t-${key}">${val}</span></div>`;
}
function setPrep(id, i){
  if(!selected.has(id)) selected.set(id, i); else selected.set(id, i);
  renderFoods(); updateCount();
}
function toggle(id){
  if (selected.has(id)) selected.delete(id); else selected.set(id, 0);
  renderFoods(); updateCount();
}
function updateCount(){
  document.getElementById('countNum').textContent = selected.size;
  document.getElementById('verBtn').disabled = selected.size === 0;
}

function calcScore() {
  const sel = [...selected.entries()].map(([id,pi]) => ({f:foods.find(x=>x.id===id), e:effective(foods.find(x=>x.id===id),pi), pi}));
  const n = sel.length;
  const avgPts = sel.reduce((a,s)=>a+s.e.pts,0)/n; // -10..10
  let pct = Math.round(((avgPts + 10) / 20) * 100); // map to 0..100
  pct = Math.max(0, Math.min(100, pct));
  const avg = k => clamp10(Math.round(sel.reduce((a,s)=>a+s.e[k],0)/n));
  return { sel, pct, cardio:avg('cardio'), energia:avg('energia'), anti:avg('anti'), sono:avg('sono'), inflam:avg('inflam'),
           negCount: sel.filter(s=>s.e.pts<0).length };
}
function notaInfo(pct){
  if(pct>=85) return {nota:'excelente',cor:'#4ade80'};
  if(pct>=70) return {nota:'muito bom',cor:'#34d399'};
  if(pct>=55) return {nota:'bom',cor:'#60a5fa'};
  if(pct>=40) return {nota:'regular',cor:'#fbbf24'};
  if(pct>=25) return {nota:'ruim',cor:'#fb923c'};
  return {nota:'crítico',cor:'#f87171'};
}

function detectCombos(sel){
  const ids = sel.map(s=>s.f.id);
  const c=[];
  if(ids.includes('sardinha')&&ids.includes('espinafre')) c.push({t:'sardinha + espinafre',d:'Ferro heme + ferro não-heme + vitamina C = absorção máxima de ferro pro transporte de O₂.'});
  if(ids.includes('arroz_branco')&&ids.includes('feijão')) c.push({t:'arroz + feijão',d:'A dupla clássica forma proteína completa com todos aminoácidos essenciais. Base sólida.'});
  if(ids.includes('salmão')&&ids.includes('batata_doce')) c.push({t:'salmão + batata-doce',d:'Jantar perfeito pré-corrida: ômega 3 + carbo de baixo IG que abastece glicogênio durante o sono.'});
  if(ids.includes('cúrcuma')&&ids.includes('azeite')) c.push({t:'cúrcuma + azeite',d:'Curcumina é lipossolúvel, a gordura do azeite multiplica sua absorção.'});
  if(ids.includes('café')&&ids.includes('refrigerante')) c.push({t:'cafeína em excesso',d:'Café + refri num dia só é muita cafeína e açúcar. Cuidado com o efeito no sono.'});
  return c;
}
function detectGaps(sel){
  const ids = sel.map(s=>s.f.id);
  const g=[];
  const hasPeixe = sel.some(s=>s.f.cat==='peixes');
  const hasNitrato = ids.some(id=>['beterraba','rúcula','espinafre','suco_beterraba','beterraba_po'].includes(id));
  const hasSono = sel.some(s=>s.e.sono>=8);
  const hasAgua = ids.includes('água')||ids.includes('água_coco');
  const hasVeg = sel.some(s=>['verduras','leguminosas'].includes(s.f.cat));
  const negs = sel.filter(s=>s.e.pts<0);
  if(negs.length>=3) g.push({c:'#f87171',m:`${negs.length} alimentos negativos no dia. Um dia assim acontece, mas evite que vire padrão — impacta direto o fôlego e a recuperação.`});
  if(!hasAgua) g.push({c:'#60a5fa',m:'Você não marcou água. Hidratação é base do desempenho — registre e garanta o consumo.'});
  if(!hasPeixe) g.push({c:'#fbbf24',m:'Sem peixe no dia — perde o maior aporte de ômega 3 anti-inflamatório.'});
  if(!hasNitrato) g.push({c:'#fbbf24',m:'Sem fonte de nitrato — vasodilatação comprometida. Beterraba ou folhas verdes resolvem.'});
  if(!hasVeg) g.push({c:'#fb923c',m:'Nenhum vegetal ou leguminosa. Faltam fibras, ferro vegetal e antioxidantes.'});
  if(!hasSono) g.push({c:'#a78bfa',m:'Nada que ajude no sono. Camomila, cereja, nozes ou magnésio melhorariam a noite antes do treino.'});
  return g;
}

function openResult(){
  if(!selected.size) return;
  const r = calcScore();
  const {nota,cor} = notaInfo(r.pct);
  const combos = detectCombos(r.sel);
  const gaps = detectGaps(r.sel);

  let insight;
  if(r.pct>=85) insight='Dia excelente. Esse é o tipo de alimentação que faz o fôlego melhorar de verdade ao longo das semanas.';
  else if(r.pct>=70) insight='Dia muito bom, com boa base cardiovascular. Pequenos ajustes te levam ao topo.';
  else if(r.pct>=55) insight='Dia ok, mas com espaço claro pra melhorar. Veja os gaps abaixo.';
  else if(r.pct>=40) insight='Dia mediano. Provavelmente faltou comida de verdade e/ou teve excesso de processados.';
  else insight='Dia pesado em alimentos ruins. Acontece, mas se repetir com frequência vai sentir na corrida e na recuperação. Amanhã é página nova.';

  const warnBanner = r.negCount>0 ? `<div class="warn-banner"><div class="warn-icon">⚠️</div><div class="warn-text"><strong>${r.negCount} ${r.negCount===1?'alimento puxou':'alimentos puxaram'} sua nota pra baixo.</strong> Estão marcados em vermelho na análise. Não precisa cortar tudo — só equilibrar com mais comida de verdade.</div></div>` : '';

  const pillarBar=(v,c)=>`<div class="pillar-bar-bg"><div class="pillar-bar-fill" style="width:${v*10}%;background:${c}"></div></div>`;

  const foodCards = r.sel.map(s=>{
    const f=s.f, e=s.e, isNeg=e.pts<0;
    const prepName = f.preps ? ` · ${f.preps[s.pi].n}` : '';
    return `<div class="analysis-card${isNeg?' neg':''}">
      <div class="analysis-food-name">${f.name}${prepName} <span style="font-weight:700;color:${isNeg?'#f87171':'#4ade80'}">${e.pts>0?'+':''}${e.pts}</span></div>
      <div class="analysis-food-cat">${f.cat}</div>
      <div class="food-bars" style="margin-bottom:8px">
        ${barRow('cardio','cardio',clamp10(e.cardio))}
        ${barRow('energia','energia',clamp10(e.energia))}
        ${barRow('anti','antioxid.',clamp10(e.anti))}
        ${barRow('inflam','anti-inflam',clamp10(e.inflam))}
        ${barRow('sono','sono',clamp10(e.sono))}
      </div>
      <div class="analysis-desc">${f.desc}</div>
      <div class="analysis-tip${isNeg?' neg':''}">${f.tip}</div>
    </div>`;
  }).join('');

  const combosHtml = combos.length ? combos.map(c=>`<div class="combo-item"><strong>${c.t}</strong><br>${c.d}</div>`).join('') : '<div class="combo-item">Nenhuma combinação sinérgica detectada hoje.</div>';
  const gapsHtml = gaps.length ? gaps.map(g=>`<div class="gap-item"><div class="gap-dot" style="background:${g.c}"></div><span>${g.m}</span></div>`).join('') : '<div class="gap-item"><div class="gap-dot" style="background:#4ade80"></div><span>Nenhum gap crítico. Dia muito bem montado.</span></div>';
  const chips = r.sel.map(s=>`<div class="chip${s.e.pts<0?' neg':''}">${s.f.name}<span class="chip-x" onclick="removeChip('${s.f.id}')">×</span></div>`).join('');

  document.getElementById('resultContent').innerHTML = `
    <div class="score-hero">
      <div class="score-pct" style="color:${cor}">${r.pct}%</div>
      <div class="score-nota" style="color:${cor}">${nota}</div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${r.pct}%;background:${cor}"></div></div>
      <div class="score-insight">${insight}</div>
    </div>
    ${warnBanner}
    <div class="pillars-grid">
      <div class="pillar-card"><div class="pillar-label">saúde cardíaca</div><div class="pillar-val" style="color:${cor}">${r.cardio}<span style="font-size:13px;color:var(--muted)">/10</span></div>${pillarBar(r.cardio,cor)}</div>
      <div class="pillar-card"><div class="pillar-label">energia aeróbica</div><div class="pillar-val" style="color:${cor}">${r.energia}<span style="font-size:13px;color:var(--muted)">/10</span></div>${pillarBar(r.energia,cor)}</div>
      <div class="pillar-card"><div class="pillar-label">antioxidante</div><div class="pillar-val" style="color:${cor}">${r.anti}<span style="font-size:13px;color:var(--muted)">/10</span></div>${pillarBar(r.anti,cor)}</div>
      <div class="pillar-card"><div class="pillar-label">anti-inflamatório</div><div class="pillar-val" style="color:var(--orange)">${r.inflam}<span style="font-size:13px;color:var(--muted)">/10</span></div>${pillarBar(r.inflam,'var(--orange)')}</div>
      <div class="pillar-card"><div class="pillar-label">qualidade do sono</div><div class="pillar-val" style="color:var(--purple)">${r.sono}<span style="font-size:13px;color:var(--muted)">/10</span></div>${pillarBar(r.sono,'var(--purple)')}</div>
      <div class="pillar-card"><div class="pillar-label">itens no dia</div><div class="pillar-val" style="color:${cor}">${r.sel.length}</div>${pillarBar(Math.min(r.sel.length,10),cor)}</div>
    </div>
    <div class="analysis-section"><div class="analysis-title">gaps e alertas</div><div class="gaps-card">${gapsHtml}</div></div>
    <div class="analysis-section"><div class="analysis-title">combinações detectadas</div><div class="combos-card">${combosHtml}</div></div>
    <div class="analysis-section"><div class="analysis-title">análise por alimento</div>${foodCards}</div>
    <div class="analysis-title">itens selecionados</div>
    <div class="chips-wrap">${chips}</div>
    <button class="limpar-btn" onclick="limpar()">limpar tudo e começar de novo</button>
  `;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('overlay').scrollTop = 0;
}
function removeChip(id){ selected.delete(id); updateCount(); if(!selected.size){closeResult();return;} openResult(); }
function closeResult(){ document.getElementById('overlay').classList.remove('open'); renderFoods(); }
function limpar(){ selected.clear(); updateCount(); closeResult(); }

document.getElementById('search').addEventListener('input', renderFoods);
renderCats(); renderFoods();
</script>
</body>
</html>

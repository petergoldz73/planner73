<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NutriPlanner</title>
<style>
:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2a2a2a;--text:#f0f0f0;--muted:#777;--green:#4ade80;--green-dim:#152b1e;--blue:#60a5fa;--blue-dim:#152038;--amber:#fbbf24;--amber-dim:#2e2008;--teal:#2dd4bf;--teal-dim:#0b2826;--purple:#a78bfa;--purple-dim:#1e1635;--orange:#fb923c;--orange-dim:#2e1a08;--red:#f87171;--red-dim:#2e1212;--r:14px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.app{max-width:500px;margin:0 auto;padding-bottom:140px}
.header{padding:18px 16px 0;position:sticky;top:0;background:var(--bg);z-index:10}
.header h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
.tabs{display:flex;gap:8px;margin-top:12px;border-bottom:1px solid var(--border)}
.tab{padding:10px 4px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-bottom-color:var(--green)}
.tab-sub{font-size:11px;color:var(--muted);font-weight:400;display:block}
.sticky-controls{position:sticky;top:108px;background:var(--bg);z-index:9;padding:10px 16px 0}
.search-input{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:15px;outline:none;margin-bottom:10px}
.cats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;border-bottom:1px solid var(--border)}
.cats::-webkit-scrollbar{display:none}
.cat-btn{padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cat-btn.active{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.section-label{padding:14px 16px 8px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.food-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.food-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px;cursor:pointer;display:flex;gap:11px;align-items:flex-start}
.food-item:active{transform:scale(.98)}
.food-item.selected{background:var(--green-dim);border-color:var(--green)}
.food-item.selected.negative{background:var(--red-dim);border-color:var(--red)}
.food-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.food-item.selected .food-check{background:var(--green);border-color:var(--green)}
.food-item.selected.negative .food-check{background:var(--red);border-color:var(--red)}
.check-icon{display:none}
.food-item.selected .check-icon{display:block}
.food-body{flex:1;min-width:0}
.food-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px}
.food-name{font-size:15px;font-weight:600;line-height:1.3}
.food-pts{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);flex-shrink:0}
.food-pts.pos{background:var(--green-dim);color:var(--green)}
.food-pts.neg{background:var(--red-dim);color:var(--red)}
.food-cat{font-size:11px;color:var(--muted);margin-bottom:5px}
.food-desc{font-size:13px;color:#aaa;line-height:1.5;margin-bottom:8px}
.prep-label,.qty-label{font-size:11px;color:var(--muted);margin-bottom:6px;margin-top:2px}
.prep-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.prep-btn{padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12px;cursor:pointer}
.prep-btn.active{background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}
.qty-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;background:var(--surface2);border-radius:8px;padding:8px 10px}
.qty-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.qty-display{flex:1;text-align:center;font-size:14px;font-weight:600}
.qty-unit{font-size:12px;color:var(--muted)}
.food-bars{display:flex;flex-direction:column;gap:5px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-size:11px;width:78px;flex-shrink:0}
.bar-bg{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bar-fill{height:4px;border-radius:2px}
.bar-val{font-size:11px;font-weight:600;width:24px;text-align:right;flex-shrink:0}
.b-cardio{background:var(--blue)}.t-cardio{color:var(--blue)}
.b-energia{background:var(--amber)}.t-energia{color:var(--amber)}
.b-anti{background:var(--teal)}.t-anti{color:var(--teal)}
.b-sono{background:var(--purple)}.t-sono{color:var(--purple)}
.b-inflam{background:var(--orange)}.t-inflam{color:var(--orange)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
/* juice builder */
.juice-wrap{padding:0 16px}
.juice-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.juice-box h3{font-size:14px;margin-bottom:4px}
.juice-box p{font-size:12px;color:var(--muted);margin-bottom:12px}
.juice-ing{display:flex;flex-wrap:wrap;gap:6px}
.ing-btn{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:13px;cursor:pointer}
.ing-btn.active{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.sweet-opts{display:flex;flex-wrap:wrap;gap:6px}
.add-juice-btn{width:100%;padding:13px;background:var(--green);color:#000;font-weight:700;border:none;border-radius:var(--r);font-size:14px;cursor:pointer;margin-top:4px}
.add-juice-btn:disabled{background:var(--surface2);color:var(--muted)}
.juice-preview{font-size:13px;color:#bbb;margin:10px 0;line-height:1.5}
/* bottom bar */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px 26px;z-index:20}
.bottom-inner{max-width:500px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.count-info{font-size:13px;color:var(--muted)}.count-info span{color:var(--text);font-weight:600}
.ver-btn{padding:13px 22px;background:var(--green);color:#000;font-size:14px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer;flex-shrink:0}
.ver-btn:disabled{background:var(--surface2);color:var(--muted)}
/* overlay */
.overlay{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
.overlay.open{display:block}
.ov-wrap{max-width:500px;margin:0 auto;padding:20px 16px 60px}
.ov-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ov-header h2{font-size:18px;font-weight:700}
.score-hero{background:var(--surface);border-radius:var(--r);padding:22px;margin-bottom:14px;text-align:center}
.score-pct{font-size:68px;font-weight:800;letter-spacing:-3px;line-height:1}
.score-nota{font-size:17px;font-weight:600;margin-top:4px;margin-bottom:14px}
.score-bar-bg{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:14px}
.score-bar-fill{height:8px;border-radius:4px}
.score-insight{font-size:13px;color:#bbb;line-height:1.6;text-align:left}
.warn-banner{border-radius:var(--r);padding:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.warn-banner.red{background:var(--red-dim);border:1px solid var(--red)}
.warn-banner.green{background:var(--green-dim);border:1px solid var(--green)}
.warn-icon{font-size:18px;flex-shrink:0}
.warn-text{font-size:13px;line-height:1.5}
.warn-banner.red .warn-text{color:#f8b4b4}.warn-banner.green .warn-text{color:#b4f8c8}
.warn-text strong{color:#fff}
.pillars-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pillar-card{background:var(--surface);border-radius:var(--rs);padding:14px}
.pillar-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.pillar-val{font-size:22px;font-weight:700;margin-bottom:6px}
.pillar-bar-bg{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.pillar-bar-fill{height:4px;border-radius:2px}
.analysis-section{margin-bottom:14px}
.analysis-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
.analysis-card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:8px}
.analysis-card.neg{border:1px solid var(--red-dim)}
.analysis-food-name{font-size:14px;font-weight:600;margin-bottom:6px}
.analysis-food-cat{font-size:11px;color:var(--muted);margin-bottom:8px}
.analysis-desc{font-size:13px;color:#aaa;line-height:1.5;margin-bottom:6px}
.analysis-tip{font-size:12px;line-height:1.5;border-left:2px solid var(--purple);padding-left:8px;margin-top:6px;color:var(--purple)}
.analysis-tip.neg{border-left-color:var(--red);color:#f8b4b4}
.combos-card,.gaps-card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:8px}
.gap-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;color:#bbb;line-height:1.5}
.gap-item:last-child{border-bottom:none}
.gap-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.combo-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:#bbb;line-height:1.5}
.combo-item:last-child{border-bottom:none;padding-bottom:0}.combo-item strong{color:var(--text)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 10px;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:12px}
.chip.neg{border-color:var(--red-dim);background:var(--red-dim)}
.chip-x{color:var(--muted);font-size:15px;cursor:pointer;line-height:1}
.action-btns{display:flex;gap:8px;margin-bottom:8px}
.action-btn{flex:1;padding:13px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.action-btn.primary{background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}
.limpar-btn{width:100%;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-size:14px;cursor:pointer;margin-top:8px}
.mode-banner{font-size:12px;padding:8px 12px;border-radius:8px;margin:10px 16px 0;text-align:center}
.mode-banner.hoje{background:var(--green-dim);color:var(--green)}
.mode-banner.amanha{background:var(--blue-dim);color:var(--blue)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>NutriPlanner</h1>
    <div class="tabs">
      <div class="tab active" id="tabHoje" onclick="setMode('hoje')">Comi hoje<span class="tab-sub">avaliar o dia</span></div>
      <div class="tab" id="tabAmanha" onclick="setMode('amanha')">Planejar<span class="tab-sub">montar cardápio</span></div>
    </div>
  </div>
  <div class="mode-banner hoje" id="modeBanner">Selecione tudo que você comeu hoje pra ver o veredito</div>
  <div class="sticky-controls">
    <input class="search-input" type="search" id="search" placeholder="buscar alimento..." autocomplete="off">
    <div class="cats" id="cats"></div>
  </div>
  <div id="mainContent"></div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <div class="count-info">selecionados: <span id="countNum">0</span></div>
    <button class="ver-btn" id="verBtn" disabled onclick="openResult()">ver veredito</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="ov-wrap">
    <div class="ov-header"><button class="back-btn" onclick="closeResult()">&#8592;</button><h2 id="ovTitle">veredito do dia</h2></div>
    <div id="resultContent"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

function clamp10(v){return Math.max(0,Math.min(10,v));}
function unitLabel(u){return {g:'g',ml:'ml',un:'un',cs:'col. sopa',cc:'col. chá',cap:'cáps',scoop:'scoop',fatia:'fatia',cc_grande:'concha'}[u]||u;}
function qtyStep(u){return {g:25,ml:50,un:1,cs:1,cc:1,cap:1,scoop:1,fatia:1,cc_grande:1}[u]||1;}

function effective(f, prepIdx){
  const base={pts:f.pts,cardio:f.cardio,energia:f.energia,anti:f.anti,sono:f.sono,inflam:f.inflam};
  if(f.preps&&f.preps[prepIdx]){const d=f.preps[prepIdx].d||{};for(const k in d)base[k]=Math.max(-10,Math.min(10,base[k]+d[k]));}
  return base;
}
// peso do item no cálculo: proporção da qty vs ref, saturando em 2x
function qtyWeight(f, qty){ if(!f.unit) return 1; const r=qty/f.ref; return Math.max(0.4, Math.min(2, r)); }

function setMode(m){
  mode=m;
  document.getElementById('tabHoje').classList.toggle('active',m==='hoje');
  document.getElementById('tabAmanha').classList.toggle('active',m==='amanha');
  const b=document.getElementById('modeBanner');
  b.className='mode-banner '+(m==='hoje'?'hoje':'amanha');
  b.textContent = m==='hoje'?'Selecione tudo que você comeu hoje pra ver o veredito':'Monte o cardápio do dia seguinte e gere um cronograma pra salvar';
  document.getElementById('verBtn').textContent = m==='hoje'?'ver veredito':'gerar cronograma';
  document.getElementById('ovTitle').textContent = m==='hoje'?'veredito do dia':'cronograma planejado';
}

}
function setFilter(c){activeFilter=c;renderCats();render();}

function render(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const el=document.getElementById('mainContent');
  if(activeFilter==='suco (montar)'){ el.innerHTML=renderJuiceBuilder(); return; }
  const list=FOODS.filter(f=>{const mc=activeFilter==='todos'||f.cat===activeFilter;const mq=!q||f.name.toLowerCase().includes(q)||f.cat.includes(q)||f.desc.toLowerCase().includes(q);return mc&&mq;});
  let html=`<div class="section-label">${q?`resultado para "${q}"`:activeFilter==='todos'?'todos os alimentos':activeFilter}</div><div class="food-list">`;
  // sucos customizados aparecem no topo de "todos"
  if((activeFilter==='todos'||activeFilter==='bebidas')&&customJuices.length&&!q){
    html+=customJuices.map(j=>{
      const sel=selected.has(j.id);
      return `<div class="food-item${sel?' selected':''}" onclick="toggleJuice('${j.id}')">
        <div class="food-check"><svg class="check-icon" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="food-body"><div class="food-top"><div class="food-name">${j.name}</div><div class="food-pts pos">+${j.pts}</div></div><div class="food-cat">suco caseiro</div></div></div>`;
    }).join('');
  }
  if(!list.length&&!customJuices.length){html+='<div class="empty">nenhum alimento encontrado</div>';}
  html+=list.map(f=>{
    const sel=selected.has(f.id);const st=sel?selected.get(f.id):{prep:0,qty:f.ref};
    const e=effective(f,st.prep);const ptsClass=e.pts>0?'pos':e.pts<0?'neg':'';const ptsTxt=e.pts>0?'+'+e.pts:e.pts;
    let prepHtml='';
    if(f.preps){prepHtml=`<div class="prep-label">preparo:</div><div class="prep-opts">`+f.preps.map((p,i)=>`<button class="prep-btn${sel&&st.prep===i?' active':''}" onclick="event.stopPropagation();setPrep('${f.id}',${i})">${p.n}</button>`).join('')+`</div>`;}
    let qtyHtml='';
    if(sel&&f.unit){qtyHtml=`<div class="qty-label">quantidade:</div><div class="qty-row"><button class="qty-btn" onclick="event.stopPropagation();chgQty('${f.id}',-1)">−</button><div class="qty-display">${st.qty} <span class="qty-unit">${unitLabel(f.unit)}</span></div><button class="qty-btn" onclick="event.stopPropagation();chgQty('${f.id}',1)">+</button></div>`;}
    return `<div class="food-item${sel?' selected':''}${sel&&e.pts<0?' negative':''}" onclick="toggle('${f.id}')">
      <div class="food-check"><svg class="check-icon" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="food-body"><div class="food-top"><div class="food-name">${f.name}</div><div class="food-pts ${ptsClass}">${ptsTxt}</div></div>
      <div class="food-cat">${f.cat}${f.unit?' · porção ref: '+f.ref+' '+unitLabel(f.unit):''}</div>
      <div class="food-desc">${f.desc}</div>${prepHtml}${qtyHtml}

  }).join('');
  html+='</div>';
  el.innerHTML=html;
}

function addJuice(){
  if(!juiceState.ings.size)return;
  const ings=[...juiceState.ings].map(i=>JUICE_ING.find(x=>x.id===i));
  const avg=k=>Math.round(ings.reduce((a,x)=>a+x[k],0)/ings.length);

  for(const k in v)v[k]=Math.max(-10,Math.min(10,v[k]));

  const juice={id:jid,name:'Suco: '+ingNames+sweetN,vals:v,pts:v.pts,cat:'bebidas',isJuice:true,

function chgQty(id,dir){const f=FOODS.find(x=>x.id===id);const st=selected.get(id);if(!st)return;const step=qtyStep(f.unit);st.qty=Math.max(step,st.qty+dir*step);selected.set(id,st);render();}

function getJuiceById(id){return customJuices.find(j=>j.id===id);}

function calcScore(){
  const sel=[];
  for(const [id,st] of selected.entries()){
    if(id.startsWith('juice_')){const j=getJuiceById(id);if(j)sel.push({f:j,e:{pts:j.vals.pts,cardio:j.vals.cardio,energia:j.vals.energia,anti:j.vals.anti,sono:j.vals.sono,inflam:j.vals.inflam},qty:1,w:1,isJuice:true});}
    else{const f=FOODS.find(x=>x.id===id);if(!f)continue;const e=effective(f,st.prep);sel.push({f,e,st,qty:st.qty,w:qtyWeight(f,st.qty)});}
  }
  const totW=sel.reduce((a,s)=>a+s.w,0);
  const wavg=k=>sel.reduce((a,s)=>a+s.e[k]*s.w,0)/totW;
  const avgPts=wavg('pts');
  let pct=Math.round(((avgPts+10)/20)*100);pct=Math.max(0,Math.min(100,pct));
  const avg=k=>clamp10(Math.round(wavg(k)));
  return {sel,pct,cardio:avg('cardio'),energia:avg('energia'),anti:avg('anti'),sono:avg('sono'),inflam:avg('inflam'),negCount:sel.filter(s=>s.e.pts<0).length};
}
function notaInfo(p){if(p>=85)return{nota:'excelente',cor:'#4ade80'};if(p>=70)return{nota:'muito bom',cor:'#34d399'};if(p>=55)return{nota:'bom',cor:'#60a5fa'};if(p>=40)return{nota:'regular',cor:'#fbbf24'};if(p>=25)return{nota:'ruim',cor:'#fb923c'};return{nota:'crítico',cor:'#f87171'};}

// GAPS — sempre gera veredito crítico, nunca vazio
function detectGaps(r){
  const ids=r.sel.map(s=>s.f.id);const g=[];
  const has=arr=>arr.some(x=>ids.includes(x));
  const cat=c=>r.sel.some(s=>s.f.cat===c);
  const hasJuice=r.sel.some(s=>s.isJuice);
  const hasPeixe=cat('peixes')||ids.includes('omega3_cap');
  const hasNitrato=has(['beterraba','rucula','espinafre','suco_beterraba','beterraba_po'])||hasJuice;
  const hasSono=r.sel.some(s=>s.e.sono>=8);
  const hasAgua=ids.includes('agua')||ids.includes('agua_coco');
  const hasVeg=cat('verduras')||cat('leguminosas');
  const hasFruta=cat('frutas')||hasJuice;
  const hasProt=cat('peixes')||cat('carnes')||cat('ovos')||ids.includes('whey')||cat('leguminosas');
  const hasCarbo=cat('grãos')||cat('tubérculos');
  const negs=r.sel.filter(s=>s.e.pts<0);

  // críticas negativas (vermelho)
  if(negs.length>=4)g.push({c:'#f87171',m:`Dia pesado: ${negs.length} itens negativos. Isso derruba o fôlego, atrapalha o sono e aumenta a inflamação. Se foi um dia de exceção, tudo bem. Se virou rotina, é o primeiro ponto a atacar.`});
  else if(negs.length>0)g.push({c:'#fb923c',m:`${negs.length} item${negs.length>1?'s':''} negativo${negs.length>1?'s':''} hoje (${negs.map(s=>s.f.name).join(', ')}). Não destrói o dia, mas equilibre com comida de verdade.`});

  // pilares fracos
  if(r.cardio<5)g.push({c:'#f87171',m:`Saúde cardíaca baixa (${r.cardio}/10). Faltam vasodilatadores e ômega 3 — beterraba, folhas verdes, peixe ou azeite mudariam isso.`});
  if(r.inflam<5)g.push({c:'#fb923c',m:`Perfil inflamatório alto (anti-inflamatório só ${r.inflam}/10). Muito processado/frito. Cúrcuma, gengibre, azeite e peixe puxam pro outro lado.`});
  if(r.anti<5)g.push({c:'#fbbf24',m:`Pouco antioxidante (${r.anti}/10). Frutas vermelhas, folhas e chá verde combatem o estresse oxidativo do treino.`});
  if(r.sono<5)g.push({c:'#a78bfa',m:`Nada que ajude o sono (${r.sono}/10). Camomila, cereja, nozes, magnésio ou melatonina melhorariam a noite — e sono ruim derruba o desempenho.`});

  // ausências estruturais
  if(!hasAgua)g.push({c:'#60a5fa',m:'Você não registrou água. Hidratação é a base do fôlego — registre e garanta o consumo ao longo do dia.'});
  if(!hasProt)g.push({c:'#fbbf24',m:'Sem fonte clara de proteína. Recuperação muscular fica comprometida — ovo, frango, peixe, feijão ou whey resolvem.'});
  if(!hasVeg&&!hasFruta)g.push({c:'#fb923c',m:'Zero vegetais e frutas. Faltam fibras, vitaminas e antioxidantes. Esse é provavelmente o maior buraco do dia.'});
  if(!hasCarbo)g.push({c:'#60a5fa',m:'Sem carboidrato de qualidade. Pra correr de manhã você precisa de glicogênio — batata-doce, arroz, aveia ou tubérculos.'});
  if(!hasPeixe&&negs.length===0)g.push({c:'#fbbf24',m:'Sem ômega 3 (peixe ou cápsula). É o maior aliado anti-inflamatório que está faltando.'});
  if(!hasNitrato)g.push({c:'#fbbf24',m:'Sem fonte de nitrato. Beterraba, rúcula ou um suco verde melhoram a vasodilatação e o fôlego direto.'});

  // elogios quando merece (verde) — garante que nunca fica "sem veredito"
  if(r.pct>=85)g.unshift({c:'#4ade80',m:'Dia muito bem montado. Cobre praticamente todos os pilares. Esse é o padrão que faz o desempenho subir ao longo das semanas.'});
  else if(r.pct>=70&&negs.length===0)g.unshift({c:'#4ade80',m:'Dia sólido e sem furos graves. Os pontos abaixo são refinos, não problemas.'});

  // fallback absoluto: nunca retorna vazio
  if(!g.length)g.push({c:'#60a5fa',m:'Dia equilibrado, sem destaques fortes nem problemas graves. Pra subir de nível, adicione um item de alta pontuação (peixe, beterraba, folha verde).'});
  return g;
}
function detectCombos(sel){
  const ids=sel.map(s=>s.f.id);const c=[];
  if(ids.includes('sardinha')&&ids.includes('espinafre'))c.push({t:'sardinha + espinafre',d:'Ferro heme + ferro vegetal + vitamina C = absorção máxima de ferro pro transporte de O₂.'});
  if(ids.includes('arroz_br')&&ids.includes('feijao'))c.push({t:'arroz + feijão',d:'Proteína completa com todos os aminoácidos. Base clássica e eficiente.'});
  if(ids.includes('salmao')&&ids.includes('batata_doce'))c.push({t:'salmão + batata-doce',d:'Jantar perfeito pré-corrida: ômega 3 + carbo de baixo IG que abastece glicogênio durante o sono.'});
  if(ids.includes('curcuma')&&ids.includes('azeite'))c.push({t:'cúrcuma + azeite',d:'Curcumina é lipossolúvel — a gordura do azeite multiplica a absorção.'});
  if((ids.includes('cafe')||ids.includes('supercoffee')||ids.includes('cafeina_cap'))&&ids.includes('melatonina'))c.push({t:'cafeína + melatonina',d:'Cuidado: tomados perto um do outro se anulam. Cafeína de manhã, melatonina à noite.'});
  if(ids.includes('whey')&&(ids.includes('banana')||ids.includes('aveia')))c.push({t:'whey + carbo',d:'Proteína + carboidrato pós-treino otimizam a recuperação e reposição de glicogênio.'});
  return c;
}

function buildResumoText(){
  if(!lastReport)return'';
  const{r,nota,gaps,insight}=lastReport;
  const titulo=mode==='amanha'?'CRONOGRAMA PLANEJADO':'RESUMO DO DIA';
  let t=`${titulo} — NutriPlanner\n\n`;
  t+=`NOTA GERAL: ${r.pct}% (${nota})\n\n`;
  t+=`PILARES:\n- Saúde cardíaca: ${r.cardio}/10\n- Energia aeróbica: ${r.energia}/10\n- Antioxidante: ${r.anti}/10\n- Anti-inflamatório: ${r.inflam}/10\n- Qualidade do sono: ${r.sono}/10\n\n`;
  t+=`ALIMENTOS:\n`;
  r.sel.forEach(s=>{const f=s.f;const prep=f.preps?' ('+f.preps[s.st.prep].n+')':'';const qty=(f.unit&&!s.isJuice)?' - '+s.qty+' '+unitLabel(f.unit):'';t+=`- ${f.name}${prep}${qty} [${s.e.pts>0?'+':''}${s.e.pts}]\n`;});
  t+=`\nVEREDITO:\n`;gaps.forEach(g=>{t+=`• ${g.m}\n`;});
  t+=`\n${insight}\n`;
  return t;
}
function copyResumo(){
  const t=buildResumoText();
  // tenta clipboard moderno
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>alert('Resumo copiado! Cole onde quiser.')).catch(()=>fallbackCopy(t));
  } else { fallbackCopy(t); }
}
function fallbackCopy(t){
  // método antigo
  try{
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.top='0';ta.style.left='0';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);
    const ok=document.execCommand('copy');document.body.removeChild(ta);
    if(ok){alert('Resumo copiado!');return;}
  }catch(e){}
  // último recurso: mostra o texto numa tela pra copiar manualmente
  showTextModal(t);
}
function showTextModal(t){
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.85);display:flex;flex-direction:column;padding:16px';
  m.innerHTML=`<div style="color:#fff;font-size:14px;margin-bottom:10px;font-weight:600">Selecione e copie o texto abaixo:</div>
    <textarea readonly style="flex:1;width:100%;background:#1a1a1a;color:#f0f0f0;border:1px solid #2a2a2a;border-radius:12px;padding:14px;font-size:13px;line-height:1.5">${t.replace(/</g,'&lt;')}</textarea>
    <button style="margin-top:12px;padding:14px;background:#4ade80;color:#000;font-weight:700;border:none;border-radius:12px;font-size:15px">fechar</button>`;
  m.querySelector('button').onclick=()=>document.body.removeChild(m);
  m.querySelector('textarea').onclick=function(){this.select();};
  document.body.appendChild(m);
}
function exportPDF(){
  if(!lastReport){alert('Monte seu dia primeiro.');return;}
  // se o jsPDF não carregou, cai pro resumo em texto
  if(!window.jspdf||!window.jspdf.jsPDF){
    alert('O gerador de PDF não carregou (pode ser a conexão). Vou abrir o resumo em texto pra você copiar.');
    showTextModal(buildResumoText());
    return;
  }
  const{r,nota,gaps,combos,insight}=lastReport;
  const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  let y=18;const L=16;const W=178;
  doc.setFontSize(18);doc.setFont(undefined,'bold');doc.text(mode==='amanha'?'Cronograma Planejado':'Resumo do Dia',L,y);y+=6;
  doc.setFontSize(10);doc.setFont(undefined,'normal');doc.setTextColor(120);doc.text('NutriPlanner · '+new Date().toLocaleDateString('pt-BR'),L,y);y+=10;
  doc.setTextColor(20);doc.setFontSize(14);doc.setFont(undefined,'bold');doc.text(`Nota geral: ${r.pct}% (${nota})`,L,y);y+=9;
  doc.setFontSize(11);doc.setFont(undefined,'bold');doc.text('Pilares',L,y);y+=6;
  doc.setFont(undefined,'normal');doc.setFontSize(10);
  [['Saúde cardíaca',r.cardio],['Energia aeróbica',r.energia],['Antioxidante',r.anti],['Anti-inflamatório',r.inflam],['Qualidade do sono',r.sono]].forEach(p=>{doc.text(`${p[0]}: ${p[1]}/10`,L+2,y);y+=5;});
  y+=4;doc.setFontSize(11);doc.setFont(undefined,'bold');doc.text('Alimentos',L,y);y+=6;doc.setFont(undefined,'normal');doc.setFontSize(10);
  r.sel.forEach(s=>{const f=s.f;const prep=f.preps?' ('+f.preps[s.st.prep].n+')':'';const qty=(f.unit&&!s.isJuice)?' - '+s.qty+' '+unitLabel(f.unit):'';const line=`• ${f.name}${prep}${qty}  [${s.e.pts>0?'+':''}${s.e.pts}]`;const split=doc.splitTextToSize(line,W);doc.text(split,L+2,y);y+=5*split.length;if(y>275){doc.addPage();y=18;}});
  y+=4;if(y>250){doc.addPage();y=18;}
  doc.setFontSize(11);doc.setFont(undefined,'bold');doc.text('Veredito',L,y);y+=6;doc.setFont(undefined,'normal');doc.setFontSize(10);
  gaps.forEach(g=>{const split=doc.splitTextToSize('• '+g.m,W);doc.text(split,L+2,y);y+=5*split.length+1;if(y>275){doc.addPage();y=18;}});
  y+=3;if(y>260){doc.addPage();y=18;}
  doc.setFont(undefined,'italic');const insSplit=doc.splitTextToSize(insight,W);doc.text(insSplit,L,y);
  try{
    doc.save((mode==='amanha'?'cronograma':'resumo')+'_nutriplanner.pdf');
  }catch(e){
    // alguns navegadores iOS bloqueiam o save direto; abre em nova aba como fallback
    try{
      const blob=doc.output('blob');const url=URL.createObjectURL(blob);window.open(url,'_blank');
    }catch(e2){
      alert('Não foi possível salvar o PDF neste navegador. Use "copiar resumo".');
    }
  }
}

document.getElementById('search').addEventListener('input',render);
renderCats();render();setMode('hoje');
</script>

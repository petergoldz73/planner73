<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NutriPlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.96 0.01 80);--surface:oklch(0.985 0.005 80);--surface2:oklch(0.93 0.01 75);
  --border:oklch(0.18 0.01 60 / 0.2);--border-strong:oklch(0.18 0.01 60);
  --text:oklch(0.18 0.01 60);--muted:oklch(0.18 0.01 60 / 0.55);
  --terracota:oklch(0.62 0.19 41);--terracota-dim:oklch(0.62 0.19 41 / 0.12);
  --green:oklch(0.55 0.15 152);--green-dim:oklch(0.55 0.15 152 / 0.12);
  --blue:oklch(0.55 0.14 250);--blue-dim:oklch(0.55 0.14 250 / 0.12);
  --amber:oklch(0.7 0.15 85);--amber-dim:oklch(0.7 0.15 85 / 0.18);
  --teal:oklch(0.6 0.13 195);--teal-dim:oklch(0.6 0.13 195 / 0.12);
  --purple:oklch(0.55 0.14 310);--purple-dim:oklch(0.55 0.14 310 / 0.12);
  --orange:oklch(0.62 0.16 55);--orange-dim:oklch(0.62 0.16 55 / 0.14);
  --red:oklch(0.55 0.19 29);--red-dim:oklch(0.55 0.19 29 / 0.12);
  --r:0px;--rs:0px;--font-mono:'Space Mono',monospace;--font-display:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
::selection{background:var(--terracota);color:#fff}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-mono);min-height:100vh}
.app{max-width:500px;margin:0 auto;padding-bottom:140px}
.header{padding:18px 16px 0;position:sticky;top:0;background:var(--bg);z-index:10}
.header h1{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
.header h1::before{content:'';width:9px;height:9px;background:var(--terracota);display:inline-block;flex-shrink:0}
.tabs{display:flex;border:1px solid var(--border-strong);width:fit-content;margin-top:14px}
.tab{padding:10px 18px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text);cursor:pointer;background:transparent}
.tab.active{background:var(--border-strong);color:var(--bg)}
.tab-sub{font-size:10px;font-weight:400;display:block;opacity:.65;text-transform:none;letter-spacing:0;margin-top:2px}
.sticky-controls{position:sticky;top:120px;background:var(--bg);z-index:9;padding:14px 16px 0}
.search-input{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);color:var(--text);font-family:var(--font-mono);font-size:14px;outline:none;margin-bottom:10px}
.cats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;border-bottom:1px solid var(--border)}
.cats::-webkit-scrollbar{display:none}
.cat-btn{padding:7px 13px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cat-btn.active{background:var(--border-strong);border-color:var(--border-strong);color:var(--bg)}
.section-label{padding:14px 16px 8px;font-size:12px;font-weight:700;color:var(--terracota);letter-spacing:.07em;text-transform:uppercase}
.food-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.food-item{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);padding:13px;cursor:pointer;display:flex;gap:11px;align-items:flex-start}
.food-item:active{transform:scale(.98)}
.food-item.selected{background:var(--green-dim);border-color:var(--green)}
.food-item.selected.negative{background:var(--red-dim);border-color:var(--red)}
.food-check{width:20px;height:20px;border-radius:var(--r);border:2px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.food-item.selected .food-check{background:var(--green);border-color:var(--green)}
.food-item.selected.negative .food-check{background:var(--red);border-color:var(--red)}
.check-icon{display:none}
.food-item.selected .check-icon{display:block}
.food-body{flex:1;min-width:0}
.food-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px}
.food-name{font-size:15px;font-weight:700;line-height:1.3}
.food-pts{font-size:12px;font-weight:700;padding:2px 8px;border-radius:var(--r);background:var(--surface2);color:var(--muted);flex-shrink:0}
.food-pts.pos{background:var(--green-dim);color:var(--green)}
.food-pts.neg{background:var(--red-dim);color:var(--red)}
.food-cat{font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.food-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.prep-label,.qty-label{font-size:11px;color:var(--muted);margin-bottom:6px;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
.prep-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.prep-btn{padding:5px 10px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface2);color:var(--muted);font-family:var(--font-mono);font-size:12px;cursor:pointer}
.prep-btn.active{background:var(--border-strong);border-color:var(--border-strong);color:var(--bg)}
.qty-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px}
.qty-btn{width:28px;height:28px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.qty-display{flex:1;text-align:center;font-size:14px;font-weight:700}
.qty-unit{font-size:12px;color:var(--muted)}
.food-bars{display:flex;flex-direction:column;gap:5px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-size:10.5px;width:78px;flex-shrink:0;text-transform:uppercase;letter-spacing:.02em}
.bar-bg{flex:1;height:5px;background:var(--surface2);border-radius:var(--r);overflow:hidden}
.bar-fill{height:5px;border-radius:var(--r)}
.bar-val{font-size:11px;font-weight:700;width:24px;text-align:right;flex-shrink:0}
.b-cardio{background:var(--blue)}.t-cardio{color:var(--blue)}
.b-energia{background:var(--amber)}.t-energia{color:var(--amber)}
.b-anti{background:var(--teal)}.t-anti{color:var(--teal)}
.b-sono{background:var(--purple)}.t-sono{color:var(--purple)}
.b-inflam{background:var(--orange)}.t-inflam{color:var(--orange)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
/* juice builder */
.juice-wrap{padding:0 16px}
.juice-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);padding:16px;margin-bottom:10px}
.juice-box h3{font-family:var(--font-display);font-size:16px;font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.01em}
.juice-box p{font-size:12px;color:var(--muted);margin-bottom:12px}
.juice-ing{display:flex;flex-wrap:wrap;gap:6px}
.ing-btn{padding:7px 12px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface2);color:var(--muted);font-family:var(--font-mono);font-size:12.5px;cursor:pointer}
.ing-btn.active{background:var(--border-strong);border-color:var(--border-strong);color:var(--bg)}
.sweet-opts{display:flex;flex-wrap:wrap;gap:6px}
.add-juice-btn{width:100%;padding:13px;background:var(--terracota);color:#fff;font-weight:700;font-family:var(--font-mono);border:none;border-radius:var(--r);font-size:13px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;margin-top:4px}
.add-juice-btn:disabled{background:var(--surface2);color:var(--muted)}
.juice-preview{font-size:13px;color:var(--muted);margin:10px 0;line-height:1.5}
/* bottom bar */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border-strong);padding:12px 16px 26px;z-index:20}
.bottom-inner{max-width:500px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.count-info{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}.count-info span{color:var(--text);font-weight:700}
.ver-btn{padding:13px 22px;background:var(--border-strong);color:var(--bg);font-family:var(--font-mono);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:none;border-radius:var(--r);cursor:pointer;flex-shrink:0}
.ver-btn:disabled{background:var(--surface2);color:var(--muted)}
/* overlay */
.overlay{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
.overlay.open{display:block}
.ov-wrap{max-width:500px;margin:0 auto;padding:20px 16px 60px}
.ov-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{width:38px;height:38px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ov-header h2{font-family:var(--font-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.score-hero{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);padding:24px;margin-bottom:14px;text-align:center}
.score-pct{font-family:var(--font-display);font-size:62px;font-weight:700;letter-spacing:-.02em;line-height:1}
.score-nota{font-size:14px;font-weight:700;margin-top:6px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em}
.score-bar-bg{height:6px;background:var(--surface2);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.score-bar-fill{height:6px;border-radius:var(--r)}
.score-insight{font-size:13px;color:var(--muted);line-height:1.6;text-align:left}
.warn-banner{border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-left:3px solid transparent}
.warn-banner.red{border-left-color:var(--red)}
.warn-banner.green{border-left-color:var(--green)}
.warn-icon{font-size:16px;flex-shrink:0}
.warn-text{font-size:13px;line-height:1.5;color:var(--text)}
.warn-banner.red .warn-text strong{color:var(--red)}.warn-banner.green .warn-text strong{color:var(--green)}
.warn-text strong{color:var(--text)}
.pillars-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pillar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:14px}
.pillar-label{font-size:10.5px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.pillar-val{font-family:var(--font-display);font-size:23px;font-weight:700;margin-bottom:6px}
.pillar-bar-bg{height:4px;background:var(--surface2);border-radius:var(--rs);overflow:hidden}
.pillar-bar-fill{height:4px;border-radius:var(--rs)}
.analysis-section{margin-bottom:14px}
.analysis-title{font-size:12px;font-weight:700;color:var(--terracota);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.analysis-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:8px}
.analysis-card.neg{border-color:var(--red)}
.analysis-food-name{font-size:14px;font-weight:700;margin-bottom:6px}
.analysis-food-cat{font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em}
.analysis-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:6px}
.analysis-tip{font-size:12px;line-height:1.5;border-left:2px solid var(--purple);padding-left:8px;margin-top:6px;color:var(--muted)}
.analysis-tip.neg{border-left-color:var(--red)}
.combos-card,.gaps-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:8px}
.gap-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px;color:var(--text);line-height:1.5}
.gap-item:last-child{border-bottom:none}
.gap-dot{width:8px;height:8px;border-radius:var(--r);flex-shrink:0;margin-top:5px}
.combo-item{padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;color:var(--muted);line-height:1.5}
.combo-item:last-child{border-bottom:none;padding-bottom:0}.combo-item strong{color:var(--text)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);font-size:12px}
.chip.neg{border-color:var(--red);background:var(--red-dim)}
.chip-x{color:var(--muted);font-size:15px;cursor:pointer;line-height:1}
.action-btns{display:flex;gap:8px;margin-bottom:8px}
.action-btn{flex:1;padding:13px;border-radius:var(--r);font-family:var(--font-mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--text)}
.action-btn.primary{background:var(--border-strong);border-color:var(--border-strong);color:var(--bg)}
.limpar-btn{width:100%;padding:14px;background:transparent;border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-family:var(--font-mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;margin-top:8px}
.mode-banner{font-size:12px;padding:10px 14px;border-radius:var(--r);margin:14px 16px 0;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:3px solid transparent}
.mode-banner.hoje{border-left-color:var(--green);color:var(--text)}
.mode-banner.amanha{border-left-color:var(--blue);color:var(--text)}
/* feed (aba início) */
.feed-list{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.feed-cta{background:var(--border-strong);color:var(--bg);border-radius:var(--r);padding:18px;cursor:pointer}
.feed-cta-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.65;margin-bottom:6px}
.feed-cta-title{font-family:var(--font-display);font-size:18px;font-weight:700}
.feed-card{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);padding:16px}
.feed-tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;margin-bottom:10px;border-radius:var(--r)}
.feed-tag.dica{background:var(--blue-dim);color:var(--blue)}
.feed-tag.curiosidade{background:var(--teal-dim);color:var(--teal)}
.feed-tag.combinacao{background:var(--purple-dim);color:var(--purple)}
.feed-tag.timing{background:var(--orange-dim);color:var(--orange)}
.feed-title{font-family:var(--font-display);font-size:16px;font-weight:700;margin-bottom:8px;line-height:1.3}
.feed-body{font-size:13.5px;line-height:1.6;color:var(--muted)}
/* prova — plano de corrida */
.prova-note{padding:0 16px 12px;font-size:12px;color:var(--muted);line-height:1.5}
.prova-form{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.prova-form label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.prova-form input{font-family:var(--font-mono);font-size:14px;padding:9px 10px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);color:var(--text)}
.prova-form button{grid-column:1/-1;font-family:var(--font-mono);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:13px;border:1px solid var(--border-strong);background:var(--border-strong);color:var(--bg);cursor:pointer;border-radius:var(--r)}
.prova-result{padding:0 16px 24px}
.prova-summary{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);padding:16px;margin-bottom:14px}
.prova-summary-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.prova-int-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.prova-int-val{font-family:var(--font-display);font-size:26px;font-weight:700;text-transform:uppercase}
.prova-int-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.prova-pdf-btn{font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:10px 14px;border:1px solid var(--border-strong);background:transparent;color:var(--text);cursor:pointer;border-radius:var(--r);white-space:nowrap}
.nivel-chips{display:flex;flex-wrap:wrap;gap:6px}
.nivel-chip{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:10px}
.nivel-chip span{text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.nivel-chip strong{font-size:12px;text-transform:capitalize}
.nivel-chip.nivel-baixo strong{color:var(--muted)}
.nivel-chip.nivel-medio strong{color:var(--amber)}
.nivel-chip.nivel-alto strong{color:var(--terracota)}
.dia-list{display:flex;flex-direction:column;gap:12px}
.dia-card{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);padding:16px}
.dia-card.bloco{background:var(--surface2)}
.dia-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dia-card-fase{font-family:var(--font-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;padding:3px 10px;border-radius:var(--r)}
.fase-prova{background:var(--terracota-dim);color:var(--terracota)}
.fase-vespera{background:var(--amber-dim);color:var(--amber)}
.fase-abastecimento{background:var(--blue-dim);color:var(--blue)}
.fase-construcao{background:var(--teal-dim);color:var(--teal)}
.fase-base{background:var(--purple-dim);color:var(--purple)}
.dia-card-date{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.dia-card-focus{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.dia-card-nota{font-size:12px;color:var(--text);font-style:italic;margin-bottom:10px;padding:8px 10px;background:var(--surface2);border-radius:var(--r)}
.refeicao-block{margin-bottom:10px}
.refeicao-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--terracota);margin-bottom:6px}
.refeicao-itens{display:flex;flex-wrap:wrap;gap:6px}
.food-swap{font-family:var(--font-mono);font-size:12px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface2);color:var(--text);cursor:pointer;max-width:100%}
.food-swap-fixed{display:inline-block;font-family:var(--font-mono);font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--muted)}
.extras-block{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.extra-item{font-size:12px;line-height:1.5;margin-bottom:8px;padding-left:10px;border-left:2px solid var(--terracota)}
.extra-item strong{display:block;margin-bottom:1px}
.usar-dia-btn{width:100%;margin-top:14px;padding:11px;font-family:var(--font-mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--border-strong);background:transparent;color:var(--text);cursor:pointer;border-radius:var(--r)}
/* login */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{max-width:340px;width:100%;background:oklch(0.18 0.01 60);border:1px solid var(--border-strong);padding:34px 26px;text-align:center}
.login-logo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:10px}
.login-logo::before{content:'';width:9px;height:9px;background:var(--terracota);display:inline-block;flex-shrink:0}
.login-logo span{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:oklch(0.96 0.01 80)}
.login-sub{font-size:13px;color:oklch(0.65 0.01 60);line-height:1.55;margin-bottom:26px}
.google-btn{width:100%;padding:13px;background:transparent;color:var(--text);font-family:var(--font-mono);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--border-strong);border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.google-btn:active{transform:scale(.98)}
.google-btn svg{flex-shrink:0}
/* header user */
.header-user{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:10px}
.header-user-name{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.logout-btn{padding:5px 10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-family:var(--font-mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;flex-shrink:0;border-radius:var(--r)}
</style>
</head>

<div class="login-screen" id="loginScreen">
  <div class="login-card">

    <p class="login-sub">Entre para montar seu cardápio e acompanhar seu score nutricional.</p>
    <button class="google-btn" id="loginBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Entrar com Google
    </button>
  </div>
</div>
<div class="app" id="app" style="display:none">
  <div class="header">
    <div class="header-user" id="headerUser" style="display:none">
      <span class="header-user-name" id="userLabel"></span>
      <button class="logout-btn" id="logoutBtn" type="button">sair</button>
    </div>
    <h1>NutriPlanner</h1>
    <div class="tabs">
      <div class="tab active" id="tabInicio" onclick="setMode('inicio')">Início<span class="tab-sub">dicas do dia</span></div>
      <div class="tab" id="tabHoje" onclick="setMode('hoje')">Comi hoje<span class="tab-sub">avaliar o dia</span></div>
      <div class="tab" id="tabAmanha" onclick="setMode('amanha')">Planejar<span class="tab-sub">montar cardápio</span></div>
      <div class="tab" id="tabProva" onclick="setMode('prova')">Prova<span class="tab-sub">plano da corrida</span></div>
    </div>
  </div>
  <div class="mode-banner hoje" id="modeBanner" style="display:none">Selecione tudo que você comeu hoje pra ver o veredito</div>
  <div class="sticky-controls" id="stickyControls" style="display:none">
    <input class="search-input" type="search" id="search" placeholder="buscar alimento..." autocomplete="off">
    <div class="cats" id="cats"></div>
  </div>
  <div id="mainContent"></div>
</div>

<div class="bottom-bar" id="bottomBar" style="display:none">
  <div class="bottom-inner">
    <div class="count-info">selecionados: <span id="countNum">0</span></div>
    <button class="ver-btn" id="verBtn" disabled onclick="openResult()">ver veredito</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="ov-wrap">
    <div class="ov-header"><button class="back-btn" onclick="closeResult()">&#8592;</button><h2 id="ovTitle">veredito do dia</h2></div>
    <div id="resultContent"></div>
  </div>
</div>

// PRNG determinístico simples (mulberry32) seedado pela data, pra rotacionar o feed por dia
function seededRandom(seed){
  let h=1779033703^seed.length;
  for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}
  return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return (h>>>0)/4294967296;};
}
function shuffleSeeded(arr,rnd){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function todaySeed(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function getFeedSelection(){
  const rnd=seededRandom(todaySeed());
  return shuffleSeeded(FEED_CARDS,rnd).slice(0,10);
}

  html+='</div>';

}

function classifyDistancia(km){ return km<=10?'curta':km<=21.5?'media':km<=42.5?'longa':'ultra'; }
function classifyPace(paceMinKm){ return paceMinKm>=6.5?'tranquilo':paceMinKm>=5.25?'moderado':paceMinKm>=4.25?'forte':'muitoForte'; }

// combina distância x pace numa classificação de intensidade da prova.
// pace "forte" pesa desproporcionalmente mais que um degrau (não é uma progressão linear:
// correr forte é bem mais exigente que só "mais rápido que moderado") — por isso o salto de
// peso de moderado(1) pra forte(3). ex: 5k tranquilo → soma 0 → leve. 21k forte → soma 4 → muito exigente.
const DIST_INDEX = {curta:0, media:1, longa:2, ultra:3};
const PACE_INDEX = {tranquilo:0, moderado:1, forte:3, muitoForte:4};
function classifyIntensidade(distCat, paceCat){
  const sum=DIST_INDEX[distCat]+PACE_INDEX[paceCat];
  if(sum===0) return 'leve';
  if(sum<=2) return 'moderada';
  if(sum===3) return 'exigente';
  return 'muito exigente';
}
const INTENSITY_INDEX = {leve:0,moderada:1,exigente:2,'muito exigente':3};

function nivel(score){ return score<1.2?'baixo':score<2.4?'médio':'alto'; }

// classifica cada dia (offset = dias antes da prova; 0 = dia da prova) numa fase
function classifyOffset(offset, daysUntil){
  if(offset===0) return 'prova';
  if(offset===1) return 'vespera';
  if(offset===2||offset===3) return 'abastecimento';
  const remaining=daysUntil-3;
  const construcaoDays=Math.ceil(remaining/2);
  const construcaoEnd=3+construcaoDays;
  return offset<=construcaoEnd ? 'construcao' : 'base';
}

const FASE_LABEL = {
  prova:'Dia da prova', vespera:'Véspera', abastecimento:'Abastecimento / carbo-loading',
  construcao:'Fase de construção', base:'Fase de base',
};
const FASE_FOCO = {
  prova:'Pré-treino específico: carboidrato leve e de fácil digestão, além de beterraba/cafeína pra vasodilatação e foco. Nada novo — só o que você já testou em treino.',
  vespera:'Carboidrato + hidratação + comida leve e segura. Evite fibra em excesso, frituras e pratos novos.',
  abastecimento:'Abastecimento (carbo-loading): foco alto em carboidrato e hidratação pra maximizar o glicogênio muscular.',
  construcao:'Equilíbrio geral entre os pilares — consistência, sem exageros nem restrições.',
  base:'Fase de base: foco em proteína (recuperação muscular) e anti-inflamatório (treinar sem acumular lesão).',
};

// monta a linha do tempo: dias individuais perto da prova (~7 dias), fases macro (data-range) pros dias distantes
function buildFasesTimeline(daysUntil, raceDate){
  const dayMs=86400000;
  const dateFor=offset=>new Date(raceDate.getTime()-offset*dayMs);
  const fmt=d=>d.toLocaleDateString('pt-BR');
  const items=[];
  const detailWindow=Math.min(daysUntil,6);

  if(daysUntil>6){
    let groups=[],curPhase=null,curStart=null,curEnd=null;
    for(let o=daysUntil;o>=7;o--){
      const ph=classifyOffset(o,daysUntil);
      if(ph!==curPhase){
        if(curPhase) groups.push({phase:curPhase,startOffset:curStart,endOffset:curEnd});
        curPhase=ph;curStart=o;curEnd=o;
      } else { curEnd=o; }
    }
    if(curPhase) groups.push({phase:curPhase,startOffset:curStart,endOffset:curEnd});
    groups.forEach(g=>{
      const dFar=dateFor(g.startOffset), dNear=dateFor(g.endOffset);
      items.push({kind:'bloco',phase:g.phase,label:FASE_LABEL[g.phase],focus:FASE_FOCO[g.phase],
        dateRange:`${fmt(dFar)} a ${fmt(dNear)}`,numDays:g.startOffset-g.endOffset+1});
    });
  }
  for(let o=detailWindow;o>=0;o--){
    const ph=classifyOffset(o,daysUntil);
    items.push({kind:'dia',phase:ph,label:FASE_LABEL[ph],focus:FASE_FOCO[ph],date:fmt(dateFor(o)),offset:o});
  }
  return items;
}

const MEAL_POOLS = {
  cafeCarbo: ['aveia','tapioca','pao_int','cuscuz'],
  cafeFruta: ['banana','mamao','maca'],
  almocoProteina: ['frango','tilapia','atum','bife_magro','ovo','lentilha'],
  almocoCarbo: ['arroz_int','batata_doce','inhame','arroz_br'],
  almocoVegetal: ['brocolis','couve','espinafre','tomate'],
  jantarProteina: ['salmao','sardinha','peru','frango'],
  jantarCarbo: ['batata_doce','arroz_int','cuscuz'],
  jantarVegetal: ['espinafre','brocolis','couve'],
  lanchePreTreino: ['banana','tapioca','maca'],
  lanchePosTreino: ['iogurte','castanha_pa','pasta_amendoim','whey'],
  antiInflamBooster: ['azeite','curcuma','gengibre'],
  proteinaAntiInflam: ['salmao','sardinha'],
};
function foodById(id){ return FOODS.find(f=>f.id===id); }
// role = de qual MEAL_POOL esse item veio (usado pra oferecer substituições equivalentes na UI)
function mealItem(food, role){ return food?{id:food.id,name:food.name,role:role||null}:null; }

// roda o pool (embaralhado uma vez por plano+papel) e escolhe pelo offset — garante que dias
// vizinhos (offset e offset+1) quase sempre caem em itens diferentes, e o ciclo se repete só
// depois de passar por todo o pool (ex: segunda aveia, terça tapioca, quarta pão integral...).
function rotatePick(poolKey, offset){
  const pool=MEAL_POOLS[poolKey];
  if(!pool||!pool.length) return null;
  const shuffled=shuffleSeeded(pool, seededRandom('planoRefeicao_'+poolKey));
  const i=((offset%shuffled.length)+shuffled.length)%shuffled.length;
  return foodById(shuffled[i]);
}

// camada extra: suplementação e timing, fora das refeições
function buildExtras(phase, niveis){
  const extras=[];
  if(phase==='prova'){
    extras.push({item:'Beterraba (suco ou em pó)',timing:'60-90min antes da largada',motivo:'o nitrato vira óxido nítrico, ajuda na vasodilatação e na eficiência do oxigênio.'});
    extras.push({item:'Cafeína (café ou cápsula)',timing:'30-60min antes da largada',motivo:'melhora a percepção de esforço e a performance — só se você já é acostumado a treinar com cafeína.'});
  }
  if(phase==='abastecimento'){
    extras.push({item:'Água de coco ou isotônico',timing:'ao longo do dia',motivo:'eletrólitos pra acompanhar o carboidrato extra e maximizar a reposição de glicogênio.'});
  }
  if(niveis.sono==='alto'||phase==='base'){
    extras.push({item:'Magnésio ou chá de camomila',timing:'30-60min antes de dormir',motivo:'relaxamento e qualidade do sono — é dormindo que boa parte da recuperação acontece.'});
  }
  if(niveis.antiinflamatorio==='alto'||phase==='base'){
    extras.push({item:'Ômega 3 (cápsula ou peixe)',timing:'junto de uma refeição com gordura',motivo:'é lipossolúvel — tomado isolado, o corpo aproveita bem menos.'});

  if(phase==='vespera'){
    extras.push({item:'Nada de novo hoje',timing:'o dia todo',motivo:'teste de alimento é coisa de treino, não de véspera de prova.'});
  }
  return extras;
}

// monta o cardápio de UM dia (café, almoço, jantar, lanches) respeitando o foco da fase
function buildCardapioDia(item, niveis){
  const {phase,offset}=item;

  if(phase==='prova'){
    const preTreino=rotatePick('lanchePreTreino',offset);
    return {
      cafe:[mealItem(preTreino,'lanchePreTreino')].filter(Boolean),
      almoco:[],jantar:[],lanches:[],
      extras:buildExtras(phase,niveis),
      nota:'Dia da prova: só o pré-treino importa. Carboidrato leve e de fácil digestão — nada pesado, nada novo.',
    };
  }
  if(phase==='vespera'){
    return {
      cafe:[mealItem(foodById('pao_int'),'cafeCarbo'),mealItem(foodById('banana'),'cafeFruta')].filter(Boolean),
      almoco:[mealItem(foodById('frango'),'almocoProteina'),mealItem(foodById('arroz_br'),'almocoCarbo'),mealItem(foodById('batata_doce'),'almocoCarbo')].filter(Boolean),
      jantar:[mealItem(foodById('macarrao'),'jantarCarbo'),mealItem(foodById('frango'),'jantarProteina')].filter(Boolean),
      lanches:[mealItem(foodById('banana'),'lanchePreTreino')].filter(Boolean),
      extras:buildExtras(phase,niveis),
      nota:'Véspera: comida leve, testada e sem novidade — nada de fibra em excesso, fritura ou tempero pesado.',
    };
  }

  const carboBoost=phase==='abastecimento';
  const antiInflamBoost=phase==='base';

  const cafe=[mealItem(rotatePick('cafeCarbo',offset),'cafeCarbo'),mealItem(rotatePick('cafeFruta',offset),'cafeFruta')].filter(Boolean);
  if(antiInflamBoost) cafe.push(mealItem(foodById('ovo'),'almocoProteina'));

  const almocoProtRole=antiInflamBoost?'proteinaAntiInflam':'almocoProteina';
  const almoco=[
    mealItem(antiInflamBoost?(rotatePick('proteinaAntiInflam',offset)||rotatePick('almocoProteina',offset)):rotatePick('almocoProteina',offset), almocoProtRole),
    mealItem(rotatePick('almocoCarbo',offset),'almocoCarbo'),
    mealItem(rotatePick('almocoVegetal',offset),'almocoVegetal'),
  ].filter(Boolean);
  if(antiInflamBoost) almoco.push(mealItem(rotatePick('antiInflamBooster',offset),'antiInflamBooster'));

  const jantar=[
    mealItem(rotatePick('jantarProteina',offset),'jantarProteina'),
    mealItem(rotatePick('jantarCarbo',offset),'jantarCarbo'),
    mealItem(rotatePick('jantarVegetal',offset),'jantarVegetal'),
  ].filter(Boolean);
  if(carboBoost) jantar.push(mealItem(rotatePick('almocoCarbo',offset+1),'almocoCarbo'));

  const lanches=[mealItem(rotatePick('lanchePreTreino',offset),'lanchePreTreino'),mealItem(rotatePick('lanchePosTreino',offset),'lanchePosTreino')].filter(Boolean);

  return {cafe,almoco,jantar,lanches,extras:buildExtras(phase,niveis)};
}

// função principal do motor — recebe distância(km), pace(min/km), data da prova (YYYY-MM-DD) e peso(kg)
function calcRacePlan(distanceKm, paceMinKm, raceDateStr, weightKg){
  const distCat=classifyDistancia(distanceKm);
  const paceCat=classifyPace(paceMinKm);
  const intensidade=classifyIntensidade(distCat,paceCat);
  const idx=INTENSITY_INDEX[intensidade];
  const weightFactor=Math.max(0.85,Math.min(1.25,weightKg/70));

  const rawCarbo=idx*1.2;
  const rawProt=idx*0.9+0.3;
  const rawHidra=idx*1.1+(distanceKm>15?0.5:0);
  const rawAnti=idx*1.0+0.4;
  const rawSono=idx*0.8+0.5;

  const niveis={
    carboidrato:nivel(rawCarbo*weightFactor),
    proteina:nivel(rawProt*weightFactor),
    hidratacao:nivel(rawHidra*weightFactor),
    antiinflamatorio:nivel(rawAnti*weightFactor),
    sono:nivel(rawSono*weightFactor),
  };

  const today=new Date(); today.setHours(0,0,0,0);
  const raceDate=new Date(raceDateStr+'T00:00:00');
  const daysUntil=Math.round((raceDate-today)/86400000);
  let fases=[];
  if(!isNaN(daysUntil)&&daysUntil>=0){
    fases=buildFasesTimeline(daysUntil,raceDate);
    fases.forEach(item=>{ if(item.kind==='dia') item.cardapio=buildCardapioDia(item,niveis); });
  }

  return {distancia:distanceKm,pace:paceMinKm,peso:weightKg,distCat,paceCat,intensidade,niveis,daysUntil,fases};
}

// troca um alimento de uma refeição de um dia específico por outro do mesmo papel (MEAL_POOL)
function trocarAlimento(offset, refeicao, idx, novoId){
  if(!provaState.resultado) return;
  const dia=provaState.resultado.fases.find(f=>f.kind==='dia'&&f.offset===offset);
  if(!dia||!dia.cardapio||!dia.cardapio[refeicao]) return;
  const atual=dia.cardapio[refeicao][idx];
  const novo=foodById(novoId);
  if(!novo||!atual) return;
  dia.cardapio[refeicao][idx]={id:novo.id,name:novo.name,role:atual.role};
  render();
}

// joga os alimentos daquele dia do plano como itens selecionados na aba "Comi hoje"
function usarDiaComiHoje(offset){
  if(!provaState.resultado) return;
  const dia=provaState.resultado.fases.find(f=>f.kind==='dia'&&f.offset===offset);
  if(!dia||!dia.cardapio) return;
  const c=dia.cardapio;
  const itens=[...c.cafe,...c.almoco,...c.jantar,...c.lanches];
  if(!itens.length){ alert('Esse dia não tem refeições pra usar (só o pré-treino).'); }
  if(selected.size>0){
    const ok=confirm('Isso vai substituir os itens já marcados em "Comi hoje". Continuar?');
    if(!ok) return;
  }
  selected.clear();
  itens.forEach(it=>{
    const f=foodById(it.id);
    if(f) selected.set(f.id,{prep:0,qty:f.ref});
  });
  updateCount();
  setMode('hoje');
}

function exportProvaPDF(){
  const r=provaState.resultado;
  if(!r||!r.fases.length){ alert('Gere um plano primeiro.'); return; }
  if(!window.jspdf||!window.jspdf.jsPDF){
    alert('O gerador de PDF não carregou (pode ser a conexão). Tente novamente em instantes.');
    return;
  }
  const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  let y=18;const L=16;const W=178;
  doc.setFontSize(18);doc.setFont(undefined,'bold');doc.text('Plano de Prova',L,y);y+=6;
  doc.setFontSize(10);doc.setFont(undefined,'normal');doc.setTextColor(120);
  doc.text(`NutriPlanner · ${r.distancia}km · pace ${r.pace}min/km · ${new Date().toLocaleDateString('pt-BR')}`,L,y);y+=10;
  doc.setTextColor(20);doc.setFontSize(13);doc.setFont(undefined,'bold');
  doc.text(`Intensidade: ${r.intensidade}  ·  ${r.daysUntil} dias até a prova`,L,y);y+=7;
  doc.setFontSize(10);doc.setFont(undefined,'normal');
  const nivelLine=`Carboidrato: ${r.niveis.carboidrato} · Proteína: ${r.niveis.proteina} · Hidratação: ${r.niveis.hidratacao} · Anti-inflam: ${r.niveis.antiinflamatorio} · Sono: ${r.niveis.sono}`;
  const nivelSplit=doc.splitTextToSize(nivelLine,W);doc.text(nivelSplit,L,y);y+=5*nivelSplit.length+6;

  r.fases.forEach(f=>{
    if(y>270){doc.addPage();y=18;}
    doc.setFontSize(12);doc.setFont(undefined,'bold');
    const header=f.kind==='bloco'?`${f.label} — ${f.numDays} dias (${f.dateRange})`:`${f.date} — ${f.label}`;
    doc.text(header,L,y);y+=6;
    doc.setFontSize(9);doc.setFont(undefined,'normal');doc.setTextColor(90);
    const focusSplit=doc.splitTextToSize(f.focus,W);doc.text(focusSplit,L,y);y+=5*focusSplit.length+2;
    doc.setTextColor(20);
    if(f.kind==='dia'&&f.cardapio){
      const c=f.cardapio;
      const mealLine=(label,arr)=>{
        if(!arr||!arr.length) return;
        if(y>275){doc.addPage();y=18;}
        doc.setFont(undefined,'bold');doc.setFontSize(9);doc.text(label+':',L+2,y);
        doc.setFont(undefined,'normal');
        const split=doc.splitTextToSize(arr.map(x=>x.name).join(', '),W-32);
        doc.text(split,L+32,y);
        y+=5*Math.max(split.length,1);
      };
      mealLine('Café',c.cafe);mealLine('Almoço',c.almoco);mealLine('Jantar',c.jantar);mealLine('Lanches',c.lanches);
      if(c.extras&&c.extras.length){
        y+=1;
        c.extras.forEach(e=>{
          if(y>278){doc.addPage();y=18;}
          const split=doc.splitTextToSize(`• ${e.item} — ${e.timing}`,W-4);
          doc.text(split,L+2,y);y+=5*split.length;
        });
      }
    }
    y+=5;
  });
  try{
    doc.save('plano_prova_nutriplanner.pdf');
  }catch(e){
    try{
      const blob=doc.output('blob');const url=URL.createObjectURL(blob);window.open(url,'_blank');
    }catch(e2){
      alert('Não foi possível salvar o PDF neste navegador.');
    }
  }
}

function clamp10(v){return Math.max(0,Math.min(10,v));}
function normalize(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function unitLabel(u){return {g:'g',ml:'ml',un:'un',cs:'col. sopa',cc:'col. chá',cap:'cáps',scoop:'scoop',fatia:'fatia',cc_grande:'concha'}[u]||u;}

function effective(f, prepIdx){
  const base={pts:f.pts,cardio:f.cardio,energia:f.energia,anti:f.anti,sono:f.sono,inflam:f.inflam};
  if(f.preps&&f.preps[prepIdx]){const d=f.preps[prepIdx].d||{};for(const k in d)base[k]=Math.max(-10,Math.min(10,base[k]+d[k]));}

}

function addJuice(){
  if(!juiceState.ings.size)return;
  const ings=[...juiceState.ings].map(i=>JUICE_ING.find(x=>x.id===i));
  const avg=k=>Math.round(ings.reduce((a,x)=>a+x[k],0)/ings.length);

  const baseMod=JUICE_BASE.find(b=>b.id===juiceState.base).mod;

  for(const k in sweetMod)v[k]=(v[k]||0)+sweetMod[k];
  for(const k in v)v[k]=Math.max(-10,Math.min(10,v[k]));
  const ingNames=ings.map(x=>x.n).join(' + ');
  const sweetN=juiceState.sweet!=='nada'?' ('+JUICE_SWEET.find(s=>s.id===juiceState.sweet).n+')':'';
  const jid='juice_'+Date.now();
  const juice={id:jid,name:'Suco: '+ingNames+sweetN,vals:v,pts:v.pts,cat:'bebidas',isJuice:true,
    desc:'Suco caseiro montado por você.',tip:juiceState.sweet==='refinado'?'O açúcar refinado derruba o valor. Tente mel ou sem adoçar.':'Suco natural é uma ótima escolha. Beba logo após o preparo pra preservar nutrientes.'};
  customJuices.push(juice);

}

function setPrep(id,i){const st=selected.get(id)||{prep:0,qty:FOODS.find(f=>f.id===id).ref};st.prep=i;selected.set(id,st);render();updateCount();}
function chgQty(id,dir){const f=FOODS.find(x=>x.id===id);const st=selected.get(id);if(!st)return;const step=qtyStep(f.unit);st.qty=Math.max(step,st.qty+dir*step);selected.set(id,st);render();}
function toggle(id){const f=FOODS.find(x=>x.id===id);if(selected.has(id))selected.delete(id);else selected.set(id,{prep:0,qty:f.ref});updateCount();render();}
function updateCount(){document.getElementById('countNum').textContent=selected.size;document.getElementById('verBtn').disabled=selected.size===0;}

function getJuiceById(id){return customJuices.find(j=>j.id===id);}

// completude: cobre os 5 grupos essenciais? cada grupo vale 20 pontos.
// penaliza dias com poucos itens (ex: 1 item nunca enche a completude, mesmo cobrindo 1 grupo).
function groupsInfo(sel){
  const cat=c=>sel.some(s=>s.f.cat===c);
  const ids=sel.map(s=>s.f.id);
  const hasJuice=sel.some(s=>s.isJuice);
  const hasProt=cat('peixes')||cat('carnes')||cat('ovos')||cat('leguminosas')||ids.includes('whey');
  const hasCarbo=cat('grãos')||cat('tubérculos');
  const hasVegFruta=cat('verduras')||cat('frutas')||hasJuice;
  const hasHidratacao=ids.includes('agua')||ids.includes('agua_coco')||ids.includes('cha_camomila')||ids.includes('cha_verde')||hasJuice;
  const hasGordura=cat('oleaginosas')||cat('sementes')||ids.includes('azeite')||ids.includes('abacate')||ids.includes('omega3_cap')||ids.includes('pasta_amendoim')||ids.includes('pasta_ganexa');
  const groups=[
    {label:'proteína',ok:hasProt},
    {label:'carboidrato',ok:hasCarbo},
    {label:'vegetal/fruta',ok:hasVegFruta},
    {label:'hidratação',ok:hasHidratacao},
    {label:'gordura boa',ok:hasGordura},
  ];
  const coveredCount=groups.filter(g=>g.ok).length;
  const missing=groups.filter(g=>!g.ok).map(g=>g.label);
  const groupScore=coveredCount*20;
  const itemFactor=Math.min(1,sel.length/4);
  const completude=Math.max(0,Math.min(100,Math.round(groupScore*itemFactor)));
  return {coveredCount,missing,completude};
}
function calcScore(){
  const sel=[];
  for(const [id,st] of selected.entries()){
    if(id.startsWith('juice_')){const j=getJuiceById(id);if(j)sel.push({f:j,e:{pts:j.vals.pts,cardio:j.vals.cardio,energia:j.vals.energia,anti:j.vals.anti,sono:j.vals.sono,inflam:j.vals.inflam},qty:1,w:1,isJuice:true});}
    else{const f=FOODS.find(x=>x.id===id);if(!f)continue;const e=effective(f,st.prep);sel.push({f,e,st,qty:st.qty,w:qtyWeight(f,st.qty)});}
  }
  const totW=sel.reduce((a,s)=>a+s.w,0);
  const wavg=k=>sel.reduce((a,s)=>a+s.e[k]*s.w,0)/totW;
  const avgPts=wavg('pts');
  let qualidade=Math.round(((avgPts+10)/20)*100);qualidade=Math.max(0,Math.min(100,qualidade));
  const avg=k=>clamp10(Math.round(wavg(k)));
  const gi=groupsInfo(sel);
  // nota final combina qualidade média (35%) e completude do dia (65%) — completude pesa mais
  // pra evitar que 1 item muito bom (ex: banana sozinha) pareça um dia excelente.
  let pct=Math.round(qualidade*0.35+gi.completude*0.65);pct=Math.max(0,Math.min(100,pct));
  return {sel,pct,qualidade,completude:gi.completude,groupsCovered:gi.coveredCount,groupsMissing:gi.missing,itemCount:sel.length,
    cardio:avg('cardio'),energia:avg('energia'),anti:avg('anti'),sono:avg('sono'),inflam:avg('inflam'),negCount:sel.filter(s=>s.e.pts<0).length};
}
function notaInfo(p){if(p>=85)return{nota:'excelente',cor:'oklch(0.5 0.16 152)'};if(p>=70)return{nota:'muito bom',cor:'oklch(0.62 0.13 152)'};if(p>=55)return{nota:'bom',cor:'oklch(0.55 0.14 250)'};if(p>=40)return{nota:'regular',cor:'oklch(0.7 0.15 85)'};if(p>=25)return{nota:'insuficiente',cor:'oklch(0.62 0.16 55)'};return{nota:'crítico',cor:'oklch(0.55 0.19 29)'};}

// GAPS — sempre gera veredito crítico, nunca vazio
function detectGaps(r){
  const ids=r.sel.map(s=>s.f.id);const g=[];
  const has=arr=>arr.some(x=>ids.includes(x));
  const cat=c=>r.sel.some(s=>s.f.cat===c);
  const hasJuice=r.sel.some(s=>s.isJuice);
  const hasPeixe=cat('peixes')||ids.includes('omega3_cap');
  const hasNitrato=has(['beterraba','rucula','espinafre','suco_beterraba','beterraba_po'])||hasJuice;
  const hasSono=r.sel.some(s=>s.e.sono>=8);
  const hasAgua=ids.includes('agua')||ids.includes('agua_coco');
  const hasVeg=cat('verduras')||cat('leguminosas');
  const hasFruta=cat('frutas')||hasJuice;
  const hasProt=cat('peixes')||cat('carnes')||cat('ovos')||ids.includes('whey')||cat('leguminosas');
  const hasCarbo=cat('grãos')||cat('tubérculos');
  const negs=r.sel.filter(s=>s.e.pts<0);

  // críticas negativas (vermelho)
  if(negs.length>=4)g.push({c:'oklch(0.55 0.19 29)',m:`Dia pesado: ${negs.length} itens negativos. Isso derruba o fôlego, atrapalha o sono e aumenta a inflamação. Se foi um dia de exceção, tudo bem. Se virou rotina, é o primeiro ponto a atacar.`});
  else if(negs.length>0)g.push({c:'oklch(0.62 0.16 55)',m:`${negs.length} item${negs.length>1?'s':''} negativo${negs.length>1?'s':''} hoje (${negs.map(s=>s.f.name).join(', ')}). Não destrói o dia, mas equilibre com comida de verdade.`});

  // pilares fracos
  if(r.cardio<5)g.push({c:'oklch(0.55 0.19 29)',m:`Saúde cardíaca baixa (${r.cardio}/10). Faltam vasodilatadores e ômega 3 — beterraba, folhas verdes, peixe ou azeite mudariam isso.`});
  if(r.inflam<5)g.push({c:'oklch(0.62 0.16 55)',m:`Perfil inflamatório alto (anti-inflamatório só ${r.inflam}/10). Muito processado/frito. Cúrcuma, gengibre, azeite e peixe puxam pro outro lado.`});
  if(r.anti<5)g.push({c:'oklch(0.7 0.15 85)',m:`Pouco antioxidante (${r.anti}/10). Frutas vermelhas, folhas e chá verde combatem o estresse oxidativo do treino.`});
  if(r.sono<5)g.push({c:'oklch(0.55 0.14 310)',m:`Nada que ajude o sono (${r.sono}/10). Camomila, cereja, nozes, magnésio ou melatonina melhorariam a noite — e sono ruim derruba o desempenho.`});

  // ausências estruturais
  if(!hasAgua)g.push({c:'oklch(0.55 0.14 250)',m:'Você não registrou água. Hidratação é a base do fôlego — registre e garanta o consumo ao longo do dia.'});
  if(!hasProt)g.push({c:'oklch(0.7 0.15 85)',m:'Sem fonte clara de proteína. Recuperação muscular fica comprometida — ovo, frango, peixe, feijão ou whey resolvem.'});
  if(!hasVeg&&!hasFruta)g.push({c:'oklch(0.62 0.16 55)',m:'Zero vegetais e frutas. Faltam fibras, vitaminas e antioxidantes. Esse é provavelmente o maior buraco do dia.'});
  if(!hasCarbo)g.push({c:'oklch(0.55 0.14 250)',m:'Sem carboidrato de qualidade. Pra correr de manhã você precisa de glicogênio — batata-doce, arroz, aveia ou tubérculos.'});
  if(!hasPeixe&&negs.length===0)g.push({c:'oklch(0.7 0.15 85)',m:'Sem ômega 3 (peixe ou cápsula). É o maior aliado anti-inflamatório que está faltando.'});
  if(!hasNitrato)g.push({c:'oklch(0.7 0.15 85)',m:'Sem fonte de nitrato. Beterraba, rúcula ou um suco verde melhoram a vasodilatação e o fôlego direto.'});
  if(r.groupsMissing.includes('gordura boa'))g.push({c:'oklch(0.7 0.15 85)',m:'Sem gordura boa (azeite, abacate, oleaginosas ou ômega 3). Ela ajuda a absorver vitaminas e reduz a inflamação.'});

  // elogios quando merece (verde) — só quando o dia é de fato completo (não só de boa qualidade)
  if(r.completude>=80&&r.pct>=85)g.unshift({c:'oklch(0.55 0.15 152)',m:'Dia muito bem montado. Cobre praticamente todos os grupos essenciais e ainda é de alta qualidade. Esse é o padrão que faz o desempenho subir ao longo das semanas.'});
  else if(r.completude>=80&&r.pct>=70&&negs.length===0)g.unshift({c:'oklch(0.55 0.15 152)',m:'Dia sólido, cobre os grupos essenciais e sem furos graves. Os pontos abaixo são refinos, não problemas.'});

  // headline de completude — quando faltam vários grupos, isso é mais importante que qualquer elogio de qualidade
  if(r.groupsMissing.length>=3){
    g.unshift({c:'oklch(0.55 0.19 29)',m:`Isso parece um lanche, não um dia completo. Cobre só ${r.groupsCovered} de 5 grupos essenciais (faltam: ${r.groupsMissing.join(', ')}). A qualidade do que foi escolhido até pode ser boa, mas completude é baixa (${r.completude}/100) — isso não sustenta um dia inteiro de treino.`});
  } else if(r.groupsMissing.length>0){
    g.push({c:'oklch(0.7 0.15 85)',m:`Faltam grupos essenciais pra fechar o dia: ${r.groupsMissing.join(', ')}. Completude atual: ${r.completude}/100.`});
  }

  // fallback absoluto: nunca retorna vazio
  if(!g.length)g.push({c:'oklch(0.55 0.14 250)',m:'Dia equilibrado, sem destaques fortes nem problemas graves. Pra subir de nível, adicione um item de alta pontuação (peixe, beterraba, folha verde).'});
  return g;
}
function detectCombos(sel){
  const ids=sel.map(s=>s.f.id);const c=[];
  if(ids.includes('sardinha')&&ids.includes('espinafre'))c.push({t:'sardinha + espinafre',d:'Ferro heme + ferro vegetal + vitamina C = absorção máxima de ferro pro transporte de O₂.'});
  if(ids.includes('arroz_br')&&ids.includes('feijao'))c.push({t:'arroz + feijão',d:'Proteína completa com todos os aminoácidos. Base clássica e eficiente.'});
  if(ids.includes('salmao')&&ids.includes('batata_doce'))c.push({t:'salmão + batata-doce',d:'Jantar perfeito pré-corrida: ômega 3 + carbo de baixo IG que abastece glicogênio durante o sono.'});
  if(ids.includes('curcuma')&&ids.includes('azeite'))c.push({t:'cúrcuma + azeite',d:'Curcumina é lipossolúvel — a gordura do azeite multiplica a absorção.'});
  if((ids.includes('cafe')||ids.includes('supercoffee')||ids.includes('cafeina_cap'))&&ids.includes('melatonina'))c.push({t:'cafeína + melatonina',d:'Cuidado: tomados perto um do outro se anulam. Cafeína de manhã, melatonina à noite.'});
  if(ids.includes('whey')&&(ids.includes('banana')||ids.includes('aveia')))c.push({t:'whey + carbo',d:'Proteína + carboidrato pós-treino otimizam a recuperação e reposição de glicogênio.'});
  return c;
}

let lastReport=null;
function openResult(){
  if(!selected.size)return;
  const r=calcScore();const{nota,cor}=notaInfo(r.pct);
  const gaps=detectGaps(r);const combos=detectCombos(r.sel);
  let insight;
  if(mode==='amanha'){
    if(r.completude<60)insight='Esse cardápio ainda não fecha um dia completo — faltam grupos essenciais inteiros, não é só questão de qualidade. Veja os ajustes abaixo antes de fechar o plano.';
    else insight=r.pct>=70?'Cardápio bem planejado pra amanhã. Siga esse plano e o dia já começa no caminho certo.':'Esse é o plano pra amanhã. Veja os ajustes sugeridos abaixo antes de fechar o cardápio.';
  } else {
    if(r.completude<60)insight='Isso cobre poucos grupos essenciais pra ser um dia completo — mais parece um lanche isolado do que uma alimentação do dia inteiro. A qualidade do que foi escolhido até pode ser boa, mas faltam grupos inteiros.';
    else if(r.pct>=85)insight='Dia excelente. Esse tipo de alimentação faz o fôlego melhorar de verdade ao longo das semanas.';
    else if(r.pct>=70)insight='Dia muito bom, boa base cardiovascular. Pequenos ajustes te levam ao topo.';
    else if(r.pct>=55)insight='Dia ok, com espaço claro pra melhorar. Veja o veredito abaixo.';
    else if(r.pct>=40)insight='Dia mediano. Provavelmente faltou comida de verdade e/ou sobrou processado.';
    else insight='Dia pesado em alimentos ruins. Acontece, mas se repetir você sente na corrida. Amanhã é página nova.';
  }
  const warnBanner = r.negCount>0
    ? `<div class="warn-banner red"><div class="warn-icon">⚠️</div><div class="warn-text"><strong>${r.negCount} ${r.negCount===1?'item puxou':'itens puxaram'} sua nota pra baixo.</strong> Marcados em vermelho abaixo. Equilibrar, não necessariamente cortar.</div></div>`
    : r.pct>=70?`<div class="warn-banner green"><div class="warn-icon">✓</div><div class="warn-text"><strong>Nenhum alimento negativo hoje.</strong> Boa base — o foco agora é refinar.</div></div>`:'';
  const pillarBar=(v,c)=>`<div class="pillar-bar-bg"><div class="pillar-bar-fill" style="width:${v*10}%;background:${c}"></div></div>`;
  const foodCards=r.sel.map(s=>{
    const f=s.f,e=s.e,isNeg=e.pts<0;
    const prepName=f.preps?` · ${f.preps[s.st.prep].n}`:'';
    const qtyName=(f.unit&&!s.isJuice)?` · ${s.qty} ${unitLabel(f.unit)}`:'';
    return `<div class="analysis-card${isNeg?' neg':''}"><div class="analysis-food-name">${f.name}${prepName}${qtyName} <span style="font-weight:700;color:${isNeg?'oklch(0.55 0.19 29)':'oklch(0.55 0.15 152)'}">${e.pts>0?'+':''}${e.pts}</span></div>
      <div class="analysis-food-cat">${f.cat}</div>
      <div class="food-bars" style="margin-bottom:8px">${barRow('cardio','cardio',clamp10(e.cardio))}${barRow('energia','energia',clamp10(e.energia))}${barRow('anti','antioxid.',clamp10(e.anti))}${barRow('inflam','anti-inflam',clamp10(e.inflam))}${barRow('sono','sono',clamp10(e.sono))}</div>
      <div class="analysis-desc">${f.desc}</div><div class="analysis-tip${isNeg?' neg':''}">${f.tip}</div></div>`;
  }).join('');
  const gapsHtml=gaps.map(g=>`<div class="gap-item"><div class="gap-dot" style="background:${g.c}"></div><span>${g.m}</span></div>`).join('');
  const combosHtml=combos.length?combos.map(c=>`<div class="combo-item"><strong>${c.t}</strong><br>${c.d}</div>`).join(''):'<div class="combo-item">Nenhuma combinação sinérgica detectada hoje.</div>';
  const chips=r.sel.map(s=>`<div class="chip${s.e.pts<0?' neg':''}">${s.f.name}<span class="chip-x" onclick="removeItem('${s.f.id}')">×</span></div>`).join('');

  const actionBtns = mode==='amanha'
    ? `<div class="action-btns"><button class="action-btn primary" onclick="exportPDF()">baixar PDF</button><button class="action-btn" onclick="copyResumo()">copiar resumo</button></div>`
    : `<div class="action-btns"><button class="action-btn" onclick="copyResumo()">copiar resumo</button></div>`;

  lastReport={r,nota,gaps,combos,insight};

  document.getElementById('resultContent').innerHTML=`
    <div class="score-hero"><div class="score-pct" style="color:${cor}">${r.pct}%</div><div class="score-nota" style="color:${cor}">${nota}</div>
    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${r.pct}%;background:${cor}"></div></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">qualidade ${r.qualidade}% · completude ${r.completude}/100 (${r.groupsCovered}/5 grupos, ${r.itemCount} ${r.itemCount===1?'item':'itens'})</div>
    <div class="score-insight">${insight}</div></div>
    ${warnBanner}
    <div class="pillars-grid">
      <div class="pillar-card"><div class="pillar-label">completude do dia</div><div class="pillar-val" style="color:${cor}">${r.completude}<span style="font-size:13px;color:var(--muted)">/100</span></div><div class="pillar-bar-bg"><div class="pillar-bar-fill" style="width:${r.completude}%;background:${cor}"></div></div></div>
      <div class="pillar-card"><div class="pillar-label">saúde cardíaca</div><div class="pillar-val" style="color:${cor}">${r.cardio}<span style="font-size:13px;color:var(--muted)">/10</span></div>${pillarBar(r.cardio,cor)}</div>
      <div class="pillar-card"><div class="pillar-label">energia aeróbica</div><div class="pillar-val" style="color:${cor}">${r.energia}<span style="font-size:13px;color:var(--muted)">/10</span></div>${pillarBar(r.energia,cor)}</div>
      <div class="pillar-card"><div class="pillar-label">antioxidante</div><div class="pillar-val" style="color:${cor}">${r.anti}<span style="font-size:13px;color:var(--muted)">/10</span></div>${pillarBar(r.anti,cor)}</div>
      <div class="pillar-card"><div class="pillar-label">anti-inflamatório</div><div class="pillar-val" style="color:var(--orange)">${r.inflam}<span style="font-size:13px;color:var(--muted)">/10</span></div>${pillarBar(r.inflam,'var(--orange)')}</div>
      <div class="pillar-card"><div class="pillar-label">qualidade do sono</div><div class="pillar-val" style="color:var(--purple)">${r.sono}<span style="font-size:13px;color:var(--muted)">/10</span></div>${pillarBar(r.sono,'var(--purple)')}</div>
      <div class="pillar-card"><div class="pillar-label">itens</div><div class="pillar-val" style="color:${cor}">${r.sel.length}</div>${pillarBar(Math.min(r.sel.length,10),cor)}</div>
    </div>
    ${actionBtns}
    <div class="analysis-section"><div class="analysis-title">veredito — gaps e alertas</div><div class="gaps-card">${gapsHtml}</div></div>
    <div class="analysis-section"><div class="analysis-title">combinações detectadas</div><div class="combos-card">${combosHtml}</div></div>
    <div class="analysis-section"><div class="analysis-title">análise por alimento</div>${foodCards}</div>
    <div class="analysis-title">itens selecionados</div><div class="chips-wrap">${chips}</div>
    <button class="limpar-btn" onclick="limpar()">limpar tudo</button>`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('overlay').scrollTop=0;
}

function buildResumoText(){
  if(!lastReport)return'';
  const{r,nota,gaps,insight}=lastReport;
  const titulo=mode==='amanha'?'CRONOGRAMA PLANEJADO':'RESUMO DO DIA';
  let t=`${titulo} — NutriPlanner\n\n`;
  t+=`NOTA GERAL: ${r.pct}% (${nota})\n`;
  t+=`Qualidade: ${r.qualidade}% · Completude: ${r.completude}/100 (${r.groupsCovered}/5 grupos essenciais, ${r.itemCount} itens)\n\n`;
  t+=`PILARES:\n- Saúde cardíaca: ${r.cardio}/10\n- Energia aeróbica: ${r.energia}/10\n- Antioxidante: ${r.anti}/10\n- Anti-inflamatório: ${r.inflam}/10\n- Qualidade do sono: ${r.sono}/10\n\n`;
  t+=`ALIMENTOS:\n`;
  r.sel.forEach(s=>{const f=s.f;const prep=f.preps?' ('+f.preps[s.st.prep].n+')':'';const qty=(f.unit&&!s.isJuice)?' - '+s.qty+' '+unitLabel(f.unit):'';t+=`- ${f.name}${prep}${qty} [${s.e.pts>0?'+':''}${s.e.pts}]\n`;});
  t+=`\nVEREDITO:\n`;gaps.forEach(g=>{t+=`• ${g.m}\n`;});
  t+=`\n${insight}\n`;
  return t;
}
function copyResumo(){
  const t=buildResumoText();
  // tenta clipboard moderno
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>alert('Resumo copiado! Cole onde quiser.')).catch(()=>fallbackCopy(t));
  } else { fallbackCopy(t); }
}
function fallbackCopy(t){
  // método antigo
  try{
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.top='0';ta.style.left='0';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);
    const ok=document.execCommand('copy');document.body.removeChild(ta);
    if(ok){alert('Resumo copiado!');return;}
  }catch(e){}
  // último recurso: mostra o texto numa tela pra copiar manualmente
  showTextModal(t);
}
function showTextModal(t){
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.6);display:flex;flex-direction:column;padding:16px';
  m.innerHTML=`<div style="color:#fff;font-family:'Space Mono',monospace;font-size:14px;margin-bottom:10px;font-weight:700">Selecione e copie o texto abaixo:</div>
    <textarea readonly style="flex:1;width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r);padding:14px;font-family:'Space Mono',monospace;font-size:13px;line-height:1.5">${t.replace(/</g,'&lt;')}</textarea>
    <button style="margin-top:12px;padding:14px;background:var(--terracota);color:#fff;font-weight:700;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.04em;border:none;border-radius:var(--r);font-size:14px">fechar</button>`;
  m.querySelector('button').onclick=()=>document.body.removeChild(m);
  m.querySelector('textarea').onclick=function(){this.select();};
  document.body.appendChild(m);
}
function exportPDF(){
  if(!lastReport){alert('Monte seu dia primeiro.');return;}
  // se o jsPDF não carregou, cai pro resumo em texto
  if(!window.jspdf||!window.jspdf.jsPDF){
    alert('O gerador de PDF não carregou (pode ser a conexão). Vou abrir o resumo em texto pra você copiar.');
    showTextModal(buildResumoText());
    return;
  }
  const{r,nota,gaps,combos,insight}=lastReport;
  const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  let y=18;const L=16;const W=178;
  doc.setFontSize(18);doc.setFont(undefined,'bold');doc.text(mode==='amanha'?'Cronograma Planejado':'Resumo do Dia',L,y);y+=6;
  doc.setFontSize(10);doc.setFont(undefined,'normal');doc.setTextColor(120);doc.text('NutriPlanner · '+new Date().toLocaleDateString('pt-BR'),L,y);y+=10;
  doc.setTextColor(20);doc.setFontSize(14);doc.setFont(undefined,'bold');doc.text(`Nota geral: ${r.pct}% (${nota})`,L,y);y+=7;
  doc.setFontSize(10);doc.setFont(undefined,'normal');doc.setTextColor(90);doc.text(`Qualidade: ${r.qualidade}% · Completude: ${r.completude}/100 (${r.groupsCovered}/5 grupos, ${r.itemCount} itens)`,L,y);y+=8;doc.setTextColor(20);
  doc.setFontSize(11);doc.setFont(undefined,'bold');doc.text('Pilares',L,y);y+=6;
  doc.setFont(undefined,'normal');doc.setFontSize(10);
  [['Saúde cardíaca',r.cardio],['Energia aeróbica',r.energia],['Antioxidante',r.anti],['Anti-inflamatório',r.inflam],['Qualidade do sono',r.sono]].forEach(p=>{doc.text(`${p[0]}: ${p[1]}/10`,L+2,y);y+=5;});
  y+=4;doc.setFontSize(11);doc.setFont(undefined,'bold');doc.text('Alimentos',L,y);y+=6;doc.setFont(undefined,'normal');doc.setFontSize(10);
  r.sel.forEach(s=>{const f=s.f;const prep=f.preps?' ('+f.preps[s.st.prep].n+')':'';const qty=(f.unit&&!s.isJuice)?' - '+s.qty+' '+unitLabel(f.unit):'';const line=`• ${f.name}${prep}${qty}  [${s.e.pts>0?'+':''}${s.e.pts}]`;const split=doc.splitTextToSize(line,W);doc.text(split,L+2,y);y+=5*split.length;if(y>275){doc.addPage();y=18;}});
  y+=4;if(y>250){doc.addPage();y=18;}
  doc.setFontSize(11);doc.setFont(undefined,'bold');doc.text('Veredito',L,y);y+=6;doc.setFont(undefined,'normal');doc.setFontSize(10);
  gaps.forEach(g=>{const split=doc.splitTextToSize('• '+g.m,W);doc.text(split,L+2,y);y+=5*split.length+1;if(y>275){doc.addPage();y=18;}});
  y+=3;if(y>260){doc.addPage();y=18;}
  doc.setFont(undefined,'italic');const insSplit=doc.splitTextToSize(insight,W);doc.text(insSplit,L,y);
  try{
    doc.save((mode==='amanha'?'cronograma':'resumo')+'_nutriplanner.pdf');
  }catch(e){
    // alguns navegadores iOS bloqueiam o save direto; abre em nova aba como fallback
    try{
      const blob=doc.output('blob');const url=URL.createObjectURL(blob);window.open(url,'_blank');
    }catch(e2){
      alert('Não foi possível salvar o PDF neste navegador. Use "copiar resumo".');
    }
  }
}

async function ensureProfile(user){
  try{
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('id')
      .eq('id', user.id);
    if(error){
      console.warn('[supabase] erro ao checar profile:', error.message);
      return;
    }
    if(!data || data.length === 0){
      const display_name = user.user_metadata?.full_name || user.email;
      const { error: insErr } = await supabaseClient
        .from('profiles')
        .insert({ id: user.id, display_name });
      if(insErr) console.warn('[supabase] erro ao criar profile:', insErr.message);
    }
  }catch(e){
    console.warn('[supabase] erro inesperado no profile:', e);
  }
}
